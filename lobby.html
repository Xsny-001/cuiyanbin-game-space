<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>联机大厅 · 崔彦斌的游戏空间</title>
    <meta name="description" content="登录后查看在线玩家，邀请好友实时对战五子棋。也支持输入房间码直接加入。" />
    <meta name="theme-color" content="#080a12" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/game.css" />
    <link rel="stylesheet" href="/assets/css/lobby.css" />
  </head>
  <body class="lobby-page">
    <header class="page-head">
      <a class="back-link" href="/index.html"><span aria-hidden="true">←</span> 游戏空间</a>
      <h1 class="page-title">联机大厅</h1>
    </header>

    <main class="lobby-shell">
      <!-- 未登录 -->
      <section class="lobby-card auth-card" id="authView" hidden>
        <h2 id="authTitle">登录联机</h2>
        <p class="auth-lead">登录后可以看到谁在线，并直接邀请对方开一局。单机游戏不需要登录。</p>

        <form id="authForm" autocomplete="on">
          <label class="field">
            <span>邮箱</span>
            <input id="email" type="email" inputmode="email" autocomplete="username" required placeholder="you@example.com" />
          </label>

          <label class="field">
            <span>密码</span>
            <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" />
          </label>

          <label class="field" id="nicknameField" hidden>
            <span>昵称</span>
            <input id="nickname" type="text" maxlength="16" autocomplete="nickname" placeholder="2–16 个字符，其他玩家看到的名字" />
          </label>

          <button class="btn primary block" id="authSubmit" type="submit">登 录</button>
        </form>

        <div class="auth-links">
          <button class="linkish" id="authToggle" type="button">没有账号？注册</button>
          <button class="linkish" id="resetBtn" type="button">找回密码</button>
        </div>

        <p class="auth-msg" id="authMsg" role="status" aria-live="polite"></p>
        <p class="auth-note">
          密码只提交给 Supabase Auth 校验，不会写入本站存储或日志。个人项目级安全，不承诺企业级合规。
        </p>
      </section>

      <!-- 已登录 -->
      <section id="lobbyView" hidden>
        <div class="lobby-bar">
          <div class="me">
            <span class="dot" id="meDot" aria-hidden="true"></span>
            <strong id="meName">玩家</strong>
          </div>
          <div class="bar-actions">
            <label class="state-pick">
              <span>状态</span>
              <select id="myState">
                <option value="idle">空闲</option>
                <option value="dnd">勿扰</option>
              </select>
            </label>
            <button class="btn ghost small" id="logoutBtn" type="button">退出登录</button>
          </div>
        </div>

        <div class="lobby-grid">
          <section class="lobby-card">
            <header class="card-head">
              <h2>在线玩家</h2>
              <span class="count" id="onlineCount">0</span>
            </header>
            <div class="player-list" id="playerList">
              <p class="empty">正在连接在线列表…</p>
            </div>
          </section>

          <section class="lobby-card">
            <h2>房间码加入</h2>
            <p class="card-lead">不需要邀请，直接进入对方创建的房间。</p>
            <label class="field">
              <span>游戏</span>
              <select id="joinGame"></select>
            </label>
            <label class="field">
              <span>房间码</span>
              <input id="roomCode" type="text" spellcheck="false" autocomplete="off" maxlength="32" placeholder="例如 15bzs4h35c5tw" />
            </label>
            <button class="btn primary block" id="joinBtn" type="button">进入房间</button>
            <p class="card-note">房间码区分大小写，长度 11–13 位，请完整复制。</p>
          </section>
        </div>
      </section>
    </main>

    <!-- 收到邀请 -->
    <div class="modal" id="inviteModal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="inviteTitle">
        <p class="modal-kicker">联机邀请</p>
        <h2 id="inviteTitle"><span id="inviteFrom">玩家</span> 邀请你</h2>
        <p class="modal-game">游戏：<strong id="inviteGame">五子棋</strong></p>
        <p class="modal-tip">30 秒内未处理会自动过期。</p>
        <div class="modal-actions">
          <button class="btn ghost" id="inviteDecline" type="button">拒绝</button>
          <button class="btn primary" id="inviteAccept" type="button">接受</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="page-foot">
      <a href="/index.html">← 返回全部游戏</a> · 崔彦斌的游戏空间
    </footer>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/net/config.js"></script>
    <script src="/assets/js/net/core.js"></script>
    <script src="/assets/js/net/lobby.js"></script>
  </body>
</html>
