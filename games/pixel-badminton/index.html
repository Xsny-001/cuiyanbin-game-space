             swing:el('swingBtn') };
let tipT = 0;
function SERVE_TIP(){
  return G.mode === 2 ? '点「挥拍」发球'
       : (G.mode === 1 ? '右摇杆向前甩发球' : '拖动球拍发球');
}
function showTip(html){ UI.tip.innerHTML = html; tipT = 2.2; }
function setGest(s){ UI.gest.textContent = s; }
function flashText(txt, col){
  UI.flash.textContent = txt; UI.flash.style.color = col || '#ffd85e';
  UI.flash.style.opacity = 1;
  clearTimeout(flashText._t);
  flashText._t = setTimeout(()=>{ UI.flash.style.opacity = 0; }, 900);
}
function updateScoreUI(){
  UI.scL.textContent = G.score[0]; UI.scR.textContent = G.score[1];
  const pIsL = P.home === 'L';
  UI.sbL.classList.toggle('me', pIsL); UI.sbR.classList.toggle('me', !pIsL);
  UI.sbL.classList.toggle('serving', G.server === 'L');
  UI.sbR.classList.toggle('serving', G.server === 'R');
}
function applyMode(m){
  G.mode = m;
  stick.L.x = stick.L.y = stick.R.x = stick.R.y = 0;
  stick.Rs.x = stick.Rs.y = stick.Rg.x = stick.Rg.y = 0;
  for(const k of ['L','R']) for(const a of TEAM[k] || []) { a.inp.swing = false; a.inp.buf = 0; }
  if(document.body && document.body.dataset) document.body.dataset.mode = String(m);
  layoutCtrl();                          // 控件刚显示，按当前屏幕方向重摆一次
  const kn = document.querySelectorAll('.knob');
  kn.forEach(k => { k.style.transform = ''; });
}
function showPanel(which){
  el('menu').classList.toggle('hidden', which !== 'menu');
  el('result').classList.toggle('hidden', which !== 'result');
  if(document.body && document.body.dataset)
    document.body.dataset.screen = which === null ? 'play' : 'menu';
}
const IDLE_TIP = () => G.mode === 2 ? '球贴近球拍时点「挥拍」'
  : (G.mode === 1 ? '左摇杆跑位 · 右摇杆甩拍' : '拖动球拍击球');
setInterval(()=>{ if(tipT > 0){ tipT -= 0.1; if(tipT <= 0) UI.tip.innerHTML = IDLE_TIP(); } }, 100);

/* 菜单交互 */
let selSide = 'L', selLv = 0, selHang = 1, selMode = 0;
let selFormat = 1, selHumans = 1, selTwo = 0;

/* 赛制变化时，重建「我方真人」的可选数量（1 .. 人数）；全场至少有 1 个真人 */
function renderHumanOpts(){
  const box = document.getElementById('humanOpts');
  if(!box) return;
  if(selHumans > selFormat) selHumans = selFormat;
  box.innerHTML = '';
  for(let i = 1; i <= selFormat; i++){
    const b = document.createElement('button');
    b.className = 'opt' + (i === selHumans ? ' sel' : '');
    b.type = 'button';
    b.dataset.humans = String(i);
    b.textContent = i + ' 人';
    b.addEventListener('click', () => {
      selHumans = i;
      box.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
      refreshHelp();
    });
    box.appendChild(b);
  }
}

const HELP = [
  '<b>拖拽</b>：按住并拖动球拍（触屏 / 鼠标 / 方向键）<br>' +
  '<b>↑ 然后迅速 ↓</b> = <b>杀球</b> <span class="en">SMASH</span><br>' +
  '<b>↓ 然后向前 ↑</b> = <b>挑球</b> <span class="en">LIFT</span><br>' +
  '<b>直接向前 ↑</b> = <b>高远球</b> <span class="en">CLEAR</span>　<b>水平前挥</b> = <b>平抽</b> <span class="en">DRIVE</span><br>' +
  '<b>轻推</b> = <b>吊球 / 搓网</b> <span class="en">DROP · NET</span><br>' +
  '向后拖可蓄力，拖得越快球越冲、落点越深<br>' +
  '<span class="en">手臂长度固定，够远够高靠<b>跨步 / 起跳</b>，不是伸胳膊</span><br>' +
  '<span class="en">慢慢挪拍碰到球会变成"挡球"，至少能把球回过去</span>',

  '<b>摇杆</b>：<b>左摇杆</b>跑位（上下可微调击球点高度）<br>' +
  '<b>右摇杆</b>甩拍，方向即招式（电脑可直接用鼠标拖）：<br>' +
  '<b>↑ 然后迅速 ↓</b> = <b>杀球</b>　<b>↓ 然后向前 ↑</b> = <b>挑球</b><br>' +
  '<b>向前上推</b> = <b>高远球</b>　<b>水平前甩</b> = <b>平抽</b><br>' +
  '<b>小幅轻推</b> = <b>吊球 / 搓网</b><br>' +
  '<span class="en">甩得越猛力度越大；摇杆方向自动跟随画面方向，横竖屏都一致</span>',

  '<b>时机</b>：跑位、举拍、选招全部自动<br>' +
  '你只需在<b>球贴近球拍</b>时点右下角 <b>挥拍</b>（或按空格）<br>' +
  '<b>PERFECT</b> 满力度　<b>GOOD</b> 八成　<b>勉强够到</b> 五成<br>' +
  '<span class="en">拍面没碰到球就是挥空；球飞到拍面附近时按下最佳</span>'
];
const HANG_TIP = '<br><b>过网滞空</b>：球飞向你时自动放慢，击中球后恢复';

function refreshHelp(){
  const box = document.getElementById('helpBox');
  if(!box) return;
  const mate = selFormat - selHumans;
  const team = selTwo
    ? '<b>' + selFormat + ' V ' + selFormat + ' · 双人同屏</b>：左半屏归 P1、右半屏归 P2' +
      (mate > 0 ? '，其余位置人机补位' : '') +
      '<br><span class="en">同一个球场各打各的半场；电脑上 P1 用鼠标 / WASD，P2 用方向键</span><br>'
    : '<b>' + selFormat + ' V ' + selFormat + '</b>：我方 ' + selHumans + ' 真人' +
      (mate > 0 ? ' + ' + mate + ' 人机队友' : '（全真人）') + ' · 对方 ' + selFormat + ' 人机' +
      (selHumans > 1 ? '<br><span class="en">多名真人时，操控权自动跟随离球最近的那位</span>' : '') +
      '<br>';
  box.innerHTML = team + HELP[selMode] + (selHang ? HANG_TIP : '<br><span class="en">过网滞空：已关闭</span>');
}
document.querySelectorAll('.opt[data-two]').forEach(b => b.addEventListener('click', () => {
  selTwo = parseInt(b.dataset.two, 10);
  document.querySelectorAll('.opt[data-two]').forEach(x => x.classList.toggle('sel', x === b));
  const row = document.getElementById('humanRow');
  if(row) row.classList.toggle('hidden', selTwo === 1);
  if(selTwo === 1) selHumans = 1;          // 双人时我方就一位真人，其余位置人机
  G.twoPlayer = selTwo === 1;
  G.format = selFormat; G.humans = selHumans;
  buildTeams();                             // 菜单背景立刻切成两边的阵容
  refreshHelp();
}));
document.querySelectorAll('.opt[data-format]').forEach(b => b.addEventListener('click', () => {
  selFormat = parseInt(b.dataset.format, 10);
  document.querySelectorAll('.opt[data-format]').forEach(x => x.classList.toggle('sel', x === b));
  renderHumanOpts();
  refreshHelp();
}));
document.querySelectorAll('.opt[data-mode]').forEach(b => b.addEventListener('click', () => {
  selMode = parseInt(b.dataset.mode, 10);
  document.querySelectorAll('.opt[data-mode]').forEach(x => x.classList.toggle('sel', x === b));
  applyMode(selMode);
  refreshHelp();
}));
document.querySelectorAll('.opt[data-side]').forEach(b => b.addEventListener('click', () => {
  selSide = b.dataset.side;
  document.querySelectorAll('.opt[data-side]').forEach(x => x.classList.toggle('sel', x === b));
  G.playerHome = selSide;      // 预览旋转方向
  buildTeams();
  layout();
  layout();
}));
document.querySelectorAll('.opt[data-hang]').forEach(b => b.addEventListener('click', () => {
  selHang = parseInt(b.dataset.hang, 10);
  document.querySelectorAll('.opt[data-hang]').forEach(x => x.classList.toggle('sel', x === b));
  G.hangTime = !!selHang;
  refreshHelp();
}));
document.querySelectorAll('.opt[data-lv]').forEach(b => b.addEventListener('click', () => {
  selLv = parseInt(b.dataset.lv, 10);
  document.querySelectorAll('.opt[data-lv]').forEach(x => x.classList.toggle('sel', x === b));
}));
el('startBtn').addEventListener('click', () => {
  audioInit();
  if(CYB && CYB.sound) CYB.sound.play('click');
  G.playerHome = selSide; G.level = selLv; G.hangTime = !!selHang;
  G.format = selFormat; G.humans = selHumans; G.twoPlayer = selTwo === 1;
  G.mode = selMode; applyMode(selMode);
  showPanel(null);
  startMatch();
});
el('againBtn').addEventListener('click', () => { showPanel(null); startMatch(); });
el('menuBtn').addEventListener('click', () => { G.state = 'menu'; showPanel('menu'); });

/* 调试/自动化接口（不影响游戏） */
window.__BADMIN = { G, ball, input, SHOT, P: () => P, A: () => A, team: () => TEAM, computeShot, start: startMatch,
                    simulate, detect: () => detectGesture(), hit: doHit,
                    slow: () => ({ active: slowActive, scale: +timeScale.toFixed(3) }),
                    stick, swing: () => { const h = HUMAN[P.home]; if(h) h.inp.swing = true; },
                    mode: m => applyMode(m), human: () => HUMAN };

/* 初始画面：待机时的静态渲染 */
buildTeams();           // 菜单阶段也要有球员站在场上
bindCtrl();
bindLayout();
applyMode(selMode);
renderHumanOpts();
refreshHelp();
showPanel('menu');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
