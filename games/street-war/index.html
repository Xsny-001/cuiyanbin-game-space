<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>巷战 · 战术小队 · 崔彦斌的游戏空间</title>
    <meta name="description" content="俯视角射击小游戏：WASD 跑位、R 换弹、Q 切换 M4A1 / RPG-7 / AWM，点击地图锁定目标。">
    <meta name="theme-color" content="#0a0a12">
    <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { background: #0a0a12; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Segoe UI', 'Courier New', monospace; }
        #gameCanvas { display: block; background: #0a0a12; }
        #ui { position: absolute; top: 20px; left: 20px; color: #e0e0e0; font-size: 14px; text-shadow: 0 0 10px rgba(0,255,255,0.3); pointer-events: none; z-index: 10; }
        #ammoUi { position: absolute; top: 20px; right: 20px; color: #00ff88; font-size: 28px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0,255,136,0.4); pointer-events: none; z-index: 10; }
        #ammoUi.low { color: #ffaa00; } #ammoUi.empty { color: #ff4444; }
        #reloadStatus { position: absolute; top: 60px; right: 20px; color: #ffaa00; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; }
        #reloadStatus.show { opacity: 1; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        #cover {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #0a0a12 0%, #1a1a2e 50%, #0a0a12 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
        #cover.hidden { opacity: 0; pointer-events: none; }
        .cover-title {
            font-size: 52px;
            color: #ff6b35;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255,107,53,0.6), 0 0 60px rgba(255,107,53,0.3);
            margin-bottom: 12px;
            letter-spacing: 6px;
        }
        .cover-subtitle {
            font-size: 22px;
            color: #888;
            margin-bottom: 60px;
            letter-spacing: 4px;
        }
        .cover-weapons {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        #startBtn {
            padding: 16px 60px;
            font-size: 26px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(255,107,53,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,107,53,0.6);
        }
        .cover-hint {
            position: absolute;
            bottom: 40px;
            color: #555;
            font-size: 13px;
            letter-spacing: 1px;
        }

        #copyright {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #0a0a12 0%, #1a1a2e 50%, #0a0a12 100%);
            z-index: 250;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
        #copyright.hidden { opacity: 0; pointer-events: none; }
        .copyright-text {
            font-size: 22px;
            color: #aaa;
            margin-bottom: 60px;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.8;
        }
        #enterBtn {
            padding: 14px 50px;
            font-size: 22px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(255,107,53,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #enterBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,107,53,0.6);
        }

        #settingsBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 210;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #settingsBtn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.1);
        }

        #settingsPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 340px;
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid rgba(255,107,53,0.4);
            border-radius: 16px;
            padding: 24px;
            z-index: 220;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(255,107,53,0.2);
        }
        #settingsPanel.show {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }
        .settings-title {
            color: #ff6b35;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            color: #ccc;
            font-size: 14px;
        }
        .settings-row label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-row input[type="range"] {
            width: 140px;
            accent-color: #ff6b35;
        }
        .hp-value {
            color: #ff6b35;
            font-weight: bold;
            min-width: 36px;
            text-align: right;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-switch.active {
            background: #ff6b35;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch.active::after {
            transform: translateX(20px);
        }
        .settings-close {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
        }
        .settings-close:hover {
            opacity: 0.9;
        }

        #respawnBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #ff4444, #ff6b35);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 4px;
            box-shadow: 0 0 30px rgba(255,68,68,0.5);
            z-index: 100;
            display: none;
            animation: pulse 1.5s infinite;
        }
        #respawnBtn.show {
            display: block;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
    
  /* ---------- 站点导航：返回游戏空间（图标按钮，悬停展开文案） ---------- */
  #back-link{position:fixed;top:calc(10px + env(safe-area-inset-top));
    left:calc(10px + env(safe-area-inset-left));z-index:9999;

    color:#dfe7ff;background:rgba(8,11,26,.72);border:2px solid rgba(120,140,220,.45);border-radius:6px;

  #back-link:hover em,#back-link:focus-visible em{display:block}

  #back-link{top:8px;left:50%;margin-left:-16px}
</style>

<body>
  <a id="back-link" href="../../index.html" title="返回游戏空间" aria-label="返回游戏空间"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg><em>游戏空间</em></a>

    <div class="loading" id="loading">加载战场资源...</div>
    
    <div id="cover">
        <div class="cover-title">巷战战术小队</div>
        <div class="cover-subtitle">TACTICAL SQUAD</div>
        <div class="cover-weapons">M4A1  ·  RPG-7  ·  AWM</div>
        <button id="startBtn">进入战场</button>
        <div class="cover-hint">横屏体验更佳 · 虚拟摇杆控制移动 · 右侧摇杆瞄准射击</div>
        
        <button id="settingsBtn">⚙</button>
        
        <div id="settingsPanel">
            <div class="settings-title">⚙ 游戏设置</div>
            <div class="settings-row">
                <label>❤️ 玩家生命值</label>
                <div style="display:flex;align-items:center;gap:8px;">
                    <input type="range" id="hpSlider" min="1" max="500" value="100">
                    <span class="hp-value" id="hpValue">100</span>
                </div>
            </div>
            <div class="settings-row">
                <label>🛡️ 无限生命</label>
                <div class="toggle-switch" id="toggleGodMode"></div>
            </div>
            <div class="settings-row">
                <label>∞ 无限弹药</label>
                <div class="toggle-switch" id="toggleInfAmmo"></div>
            </div>
            <div class="settings-row">
                <label>💀 一击必杀</label>
                <div class="toggle-switch" id="toggleOneShot"></div>
            </div>
            <div class="settings-row">
                <label>⚡ 超快射速</label>
                <div class="toggle-switch" id="toggleFastFire"></div>
            </div>
            <button class="settings-close" id="closeSettings">确认</button>
        </div>
    </div>

    <div id="copyright">
        <div class="copyright-text">版权归用户2167·pvm所有<br>二创请说明原创</div>
        <button id="enterBtn">进入战场</button>
    </div>
    
    <div id="ui"><div>巷战模拟器 - 战术小队版</div><div style="font-size:12px;color:#888;">WASD移动 | R换弹 | Q切换武器 | 点击地图锁定目标</div></div>
    <div id="ammoUi">30 / 30</div>
    <div id="reloadStatus">换弹中...</div>
    <button id="respawnBtn">立即复活</button>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        const Settings = {
            playerMaxHP: 100,
            godMode: false,
            infAmmo: false,
            oneShot: false,
            fastFire: false
        };

        const hpSlider = document.getElementById('hpSlider');
        const hpValue = document.getElementById('hpValue');
        hpSlider.addEventListener('input', (e) => {
            Settings.playerMaxHP = parseInt(e.target.value);
            hpValue.textContent = Settings.playerMaxHP;
            if (playerState === 'alive') {
                playerMaxHP = Settings.playerMaxHP;
                playerHP = Math.min(playerHP, playerMaxHP);
            }
        });

        function toggleSwitch(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('click', () => {
                Settings[key] = !Settings[key];
                el.classList.toggle('active', Settings[key]);
            });
        }
        toggleSwitch('toggleGodMode', 'godMode');
        toggleSwitch('toggleInfAmmo', 'infAmmo');
        toggleSwitch('toggleOneShot', 'oneShot');
        toggleSwitch('toggleFastFire', 'fastFire');

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.add('show');
        });
        document.getElementById('closeSettings').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.remove('show');
        });

        // 辅助瞄准系统
        const AimAssist = {
            active: false,
            targetX: 0,
            targetY: 0,
            targetAgent: null,
            markSize: 40,
            markPulse: 0,
            lineAlpha: 0.8,
            
            setTarget(worldX, worldY) {
                this.targetX = worldX;
                this.targetY = worldY;
                this.targetAgent = null;
                this.active = true;
                
                // 检查是否点击到敌人
                for (const agent of aiAgents) {
                    if (agent.state === 'dead') continue;
                    const dist = Math.hypot(agent.x - worldX, agent.y - worldY);
                    if (dist < agent.radius + 30) {
                        this.targetAgent = agent;
                        break;
                    }
                }
            },
            
            clearTarget() {
                this.active = false;
                this.targetAgent = null;
            },
            
            update() {
                this.markPulse += 0.08;
                if (this.targetAgent) {
                    if (this.targetAgent.state === 'dead') {
                        this.targetAgent = null;
                        this.active = false;
                    } else {
                        this.targetX = this.targetAgent.x;
                        this.targetY = this.targetAgent.y;
                    }
                }
                
                if (this.active && playerState === 'alive') {
                    // 枪口始终朝向目标
                    const dx = this.targetX - player.x;
                    const dy = this.targetY - player.y;
                    const targetAngle = Math.atan2(dy, dx) - Math.PI;
                    
                    // 根据当前武器获取正确的旋转角度，计算平滑差值
                    let currentRotation;
                    if (currentWeapon === 'rifle') {
                        currentRotation = gun.rotation;
                    } else if (currentWeapon === 'rpg') {
                        currentRotation = rpg.rotation;
                    } else {
                        currentRotation = awm.rotation;
                    }
                    
                    let diff = targetAngle - currentRotation;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    
                    const smoothFactor = 0.15;
                    if (currentWeapon === 'rifle') {
                        gun.rotation += diff * smoothFactor;
                    } else if (currentWeapon === 'rpg') {
                        rpg.rotation += diff * smoothFactor;
                    } else {
                        awm.rotation += diff * smoothFactor;
                    }
                }
            },
            
            draw(ctx) {
                if (!this.active) return;
                
                const screenX = this.targetX - camera.x;
                const screenY = this.targetY - camera.y;
                
                // 绘制红框标记
                const pulse = Math.sin(this.markPulse) * 4;
                const size = this.markSize + pulse;
                
                ctx.save();
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 12;
                ctx.setLineDash([]);
                
                // 四角标记
                const cornerLen = 12;
                // 左上
                ctx.beginPath();
                ctx.moveTo(screenX - size/2, screenY - size/2 + cornerLen);
                ctx.lineTo(screenX - size/2, screenY - size/2);
                ctx.lineTo(screenX - size/2 + cornerLen, screenY - size/2);
                ctx.stroke();
                // 右上
                ctx.beginPath();
                ctx.moveTo(screenX + size/2 - cornerLen, screenY - size/2);
                ctx.lineTo(screenX + size/2, screenY - size/2);
                ctx.lineTo(screenX + size/2, screenY - size/2 + cornerLen);
                ctx.stroke();
                // 左下
                ctx.beginPath();
                ctx.moveTo(screenX - size/2, screenY + size/2 - cornerLen);
                ctx.lineTo(screenX - size/2, screenY + size/2);
                ctx.lineTo(screenX - size/2 + cornerLen, screenY + size/2);
                ctx.stroke();
                // 右下
                ctx.beginPath();
                ctx.moveTo(screenX + size/2 - cornerLen, screenY + size/2);
                ctx.lineTo(screenX + size/2, screenY + size/2);
                ctx.lineTo(screenX + size/2, screenY + size/2 - cornerLen);
                ctx.stroke();
                
                // 如果是敌人，加十字准星
                if (this.targetAgent) {
                    ctx.strokeStyle = '#ff4444';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(screenX - size/2 - 5, screenY);
                    ctx.lineTo(screenX + size/2 + 5, screenY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY - size/2 - 5);
                    ctx.lineTo(screenX, screenY + size/2 + 5);
                    ctx.stroke();
                }
                
                ctx.shadowBlur = 0;
                ctx.restore();
                
                // 绘制红色虚线连接枪口和目标
                if (playerState === 'alive') {
                    const muzzleOffset = currentWeapon === 'rifle' ? -108 : currentWeapon === 'rpg' ? -140 : -93;
                    const muzzleYOffset = currentWeapon === 'rifle' ? -16 : currentWeapon === 'rpg' ? 0 : 0;
                    let muzzleX, muzzleY;
                    
                    if (currentWeapon === 'rifle') {
                        const m = localToWorld(muzzleOffset, muzzleYOffset);
                        muzzleX = m.x; muzzleY = m.y;
                    } else if (currentWeapon === 'rpg') {
                        const m = localToWorldRPG(muzzleOffset, muzzleYOffset);
                        muzzleX = m.x; muzzleY = m.y;
                    } else {
                        const m = localToWorldAWM(muzzleOffset, muzzleYOffset);
                        muzzleX = m.x; muzzleY = m.y;
                    }
                    
                    const muzzleScreenX = muzzleX - camera.x;
                    const muzzleScreenY = muzzleY - camera.y;
                    
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 50, 50, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([10, 6]);
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(muzzleScreenX, muzzleScreenY);
                    ctx.lineTo(screenX, screenY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.shadowBlur = 0;
                    
                    // 枪口端小圆点
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
                    ctx.beginPath();
                    ctx.arc(muzzleScreenX, muzzleScreenY, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 目标端小圆点
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            }
        };

        class ObjectPool {
            constructor(factory, reset, initSize = 40) {
                this.factory = factory;
                this.reset = reset;
                this.pool = [];
                for (let i = 0; i < initSize; i++) this.pool.push(factory());
            }
            get() {
                let obj = this.pool.pop();
                if (!obj) obj = this.factory();
                this.reset(obj);
                return obj;
            }
            release(obj) {
                this.reset(obj);
                this.pool.push(obj);
            }
        }

        const Pools = {
            bullets: new ObjectPool(
                () => ({x:0,y:0,vx:0,vy:0,life:0,prevX:0,prevY:0,isAWM:false,fromAI:false,team:''}),
                o => { o.x=o.y=o.vx=o.vy=o.life=o.prevX=o.prevY=0; o.isAWM=false; o.fromAI=false; o.team=''; }
            ),
            shells: new ObjectPool(
                () => ({x:0,y:0,vx:0,vy:0,rotation:0,vRot:0,gravity:0,life:0,alpha:1,type:''}),
                o => { o.x=o.y=o.vx=o.vy=o.rotation=o.vRot=o.gravity=o.life=0; o.alpha=1; o.type=''; }
            ),
            smokes: new ObjectPool(
                () => ({x:0,y:0,vx:0,vy:0,size:0,grow:0,alpha:0,life:0}),
                o => { o.x=o.y=o.vx=o.vy=o.size=o.grow=o.alpha=o.life=0; }
            ),
            particles: new ObjectPool(
                () => ({x:0,y:0,vx:0,vy:0,gravity:0,life:0,maxLife:0,size:0,rotation:0,vRot:0,type:'',color:''}),
                o => { o.x=o.y=o.vx=o.vy=o.gravity=o.life=o.maxLife=o.size=o.rotation=o.vRot=0; o.type=o.color=''; }
            ),
            rockets: new ObjectPool(
                () => ({x:0,y:0,vx:0,vy:0,angle:0,life:0,trail:[],safeTimer:0}),
                o => { o.x=o.y=o.vx=o.vy=o.angle=o.life=o.safeTimer=0; o.trail.length=0; }
            )
        };

        const PerfOptimizer = {
            limits: { bullets: 120, shells: 50, smokes: 150, particles: 400, rockets: 15, explosions: 20, muzzleFlashes: 10, droppedMags: 10 },
            frameCount: 0,
            cleanupInterval: 300,
            enforce(arr, type) {
                const limit = this.limits[type];
                if (arr.length > limit) {
                    const excess = arr.length - limit;
                    const pool = Pools[type];
                    if (pool) {
                        for (let i = 0; i < excess; i++) pool.release(arr[i]);
                    }
                    arr.splice(0, excess);
                }
            },
            tick() {
                this.frameCount++;
                if (this.frameCount % this.cleanupInterval === 0) this.gc();
            },
            gc() {
                this.enforce(bullets, 'bullets');
                this.enforce(shells, 'shells');
                this.enforce(smokes, 'smokes');
                this.enforce(particles, 'particles');
                this.enforce(rockets, 'rockets');
                this.enforce(explosions, 'explosions');
                this.enforce(muzzleFlashes, 'muzzleFlashes');
                this.enforce(droppedMags, 'droppedMags');
                const maxPool = 120;
                for (const key in Pools) {
                    const p = Pools[key];
                    if (p.pool.length > maxPool) p.pool.length = maxPool;
                }
            }
        };

        const SpatialGrid = {

                const maxCY = Math.floor((obs.y + obs.h) / this.cellSize);
                for (let cy = minCY; cy <= maxCY; cy++) {
                    for (let cx = minCX; cx <= maxCX; cx++) {
                        const k = this.key(cx, cy);
                        if (!this.cells[k]) this.cells[k] = [];
                        this.cells[k].push(obs);
                    }
                }
            },
            getNearby(x, y, radius) {
                const minCX = Math.floor((x - radius) / this.cellSize);
                const minCY = Math.floor((y - radius) / this.cellSize);
                const maxCX = Math.floor((x + radius) / this.cellSize);
                const maxCY = Math.floor((y + radius) / this.cellSize);
                const result = [];
                const seen = new Set();
                for (let cy = minCY; cy <= maxCY; cy++) {
                    for (let cx = minCX; cx <= maxCX; cx++) {
                        const cell = this.cells[this.key(cx, cy)];
                        if (cell) {
                            for (const obs of cell) {
                                if (!seen.has(obs)) {
                                    seen.add(obs);
                                    result.push(obs);
                                }
                            }
                        }
                    }
                }
                return result;
            }

        const TILE_SIZE = 64;

        const player = { x: MAP_WIDTH * TILE_SIZE / 2, y: MAP_HEIGHT * TILE_SIZE / 2, radius: 16, speed: 4 };
        let playerHP = 100, playerMaxHP = 100, playerState = 'alive', playerDeadTimer = 0, playerRespawnTime = 5000, damageFlash = 0;

        const aiAgents = [];

        function initAIGrid() {
            for (let y = 0; y < MAP_HEIGHT; y++) {

                for (let x = 0; x < MAP_WIDTH; x++) aiGrid[y][x] = 0;
            }
            for (const obs of map.obstacles) {

                    const startX = Math.max(0, Math.floor(obs.x / TILE_SIZE));
                    const startY = Math.max(0, Math.floor(obs.y / TILE_SIZE));
                    const endX = Math.min(MAP_WIDTH - 1, Math.floor((obs.x + obs.w) / TILE_SIZE));
                    const endY = Math.min(MAP_HEIGHT - 1, Math.floor((obs.y + obs.h) / TILE_SIZE));

        function findSafeSpawn(x, y, radius) {
            if (!checkCollision(x, y, radius)) return {x, y};
            for (let r = 30; r < 400; r += 30) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    const tx = x + Math.cos(a) * r;
                    const ty = y + Math.sin(a) * r;
                    if (!checkCollision(tx, ty, radius)) return {x: tx, y: ty};
                }
            }
            return {x, y};

        class AIAgent {

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        }

        function findPath(startX, startY, endX, endY) {
            const sx = Math.floor(Math.max(0, Math.min(MAP_WIDTH - 1, startX)) / TILE_SIZE);
            const sy = Math.floor(Math.max(0, Math.min(MAP_HEIGHT - 1, startY)) / TILE_SIZE);
            let ex = Math.floor(Math.max(0, Math.min(MAP_WIDTH - 1, endX)) / TILE_SIZE);
            let ey = Math.floor(Math.max(0, Math.min(MAP_HEIGHT - 1, endY)) / TILE_SIZE);
            
            if (aiGrid[ey][ex] === 1) {
                let bestDist = Infinity;
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const nx = ex + dx, ny = ey + dy;
                        if (nx >= 0 && nx < MAP_WIDTH && ny >= 0 && ny < MAP_HEIGHT && aiGrid[ny][nx] === 0) {
                            const d = Math.abs(nx - sx) + Math.abs(ny - sy);
                            if (d < bestDist) { bestDist = d; ex = nx; ey = ny; }
                        }
                    }
                }
                if (bestDist === Infinity) return [];
            }
            
            const open = [];
            const closed = new Set();
            const cameFrom = {};
            const gScore = {};
            const startKey = `${sx},${sy}`;
            gScore[startKey] = 0;
            open.push({x: sx, y: sy, f: Math.abs(sx - ex) + Math.abs(sy - ey)});
            
            while (open.length > 0) {
                open.sort((a, b) => a.f - b.f);
                const current = open.shift();
                const key = `${current.x},${current.y}`;
                if (current.x === ex && current.y === ey) {
                    const path = [];
                    let curr = key;
                    while (curr) {
                        const [cx, cy] = curr.split(',').map(Number);
                        path.push({x: (cx + 0.5) * TILE_SIZE, y: (cy + 0.5) * TILE_SIZE});
                        curr = cameFrom[curr];
                    }
                    return path.reverse();
                }
                if (closed.has(key)) continue;
                closed.add(key);
                const neighbors = [
                    {x: current.x+1, y: current.y}, {x: current.x-1, y: current.y},
                    {x: current.x, y: current.y+1}, {x: current.x, y: current.y-1},
                    {x: current.x+1, y: current.y+1}, {x: current.x-1, y: current.y-1},
                    {x: current.x+1, y: current.y-1}, {x: current.x-1, y: current.y+1}
                ];
                for (const n of neighbors) {
                    if (n.x < 0 || n.x >= MAP_WIDTH || n.y < 0 || n.y >= MAP_HEIGHT) continue;
                    if (aiGrid[n.y][n.x] === 1) continue;
                    const nKey = `${n.x},${n.y}`;
                    const tentativeG = gScore[key] + ((n.x !== current.x && n.y !== current.y) ? 1.414 : 1);
                    if (!gScore[nKey] || tentativeG < gScore[nKey]) {
                        cameFrom[nKey] = key;
                        gScore[nKey] = tentativeG;
                        const h = Math.abs(n.x - ex) + Math.abs(n.y - ey);
                        open.push({x: n.x, y: n.y, f: tentativeG + h});
                    }
                }
            }
            return [];
        }

        function hasLineOfSight(a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            if (dist === 0) return true;
            const steps = Math.max(1, Math.floor(dist / 64));
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const tx = a.x + dx * t, ty = a.y + dy * t;
                const nearby = SpatialGrid.getNearby(tx, ty, 8);
                for (const obs of nearby) {
                    if (obs.solid && tx > obs.x && tx < obs.x + obs.w && ty > obs.y && ty < obs.y + obs.h) return false;
                }
            }
            return true;
        }

        function findBestTarget(agent) {
            let best = null, bestScore = Infinity;
            const candidates = [];
            if (agent.team === 'enemy') {
                if (playerState === 'alive') candidates.push({x: player.x, y: player.y, hp: playerHP, isPlayer: true});
                for (const a of aiAgents) if (a.team === 'ally' && a.state === 'alive') candidates.push({x: a.x, y: a.y, hp: a.hp});
            } else {
                for (const a of aiAgents) if (a.team === 'enemy' && a.state === 'alive') candidates.push({x: a.x, y: a.y, hp: a.hp});
            }
            for (const c of candidates) {
                const dist = Math.hypot(c.x - agent.x, c.y - agent.y);
                if (dist > agent.visionRange) continue;
                if (!hasLineOfSight(agent, c)) continue;
                if (dist < bestScore) { bestScore = dist; best = c; }
            }
            return best;
        }

        function followPath(agent) {
            if (!agent.path || agent.path.length === 0) return;
            const target = agent.path[0];
            const dx = target.x - agent.x, dy = target.y - agent.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 12) { agent.path.shift(); return; }
            const angle = Math.atan2(dy, dx);
            const mx = Math.cos(angle) * agent.speed;
            const my = Math.sin(angle) * agent.speed;
            if (!checkCollision(agent.x + mx, agent.y, agent.radius)) agent.x += mx;
            else if (!checkCollision(agent.x, agent.y + my, agent.radius)) agent.y += my;
            if (!checkCollision(agent.x, agent.y + my, agent.radius)) agent.y += my;
        }

        function findNearbyCover(agent, threatX, threatY) {
            let bestCover = null;
            let bestScore = -Infinity;
            const nearby = SpatialGrid.getNearby(agent.x, agent.y, 200);
            
            for (const obs of nearby) {
                if (!obs.solid) continue;
                const cx = obs.x + obs.w/2;
                const cy = obs.y + obs.h/2;
                const distToAgent = Math.hypot(cx - agent.x, cy - agent.y);
                if (distToAgent > 180 || distToAgent < 40) continue;
                
                const threatAngle = Math.atan2(threatY - agent.y, threatX - agent.x);
                const coverAngle = Math.atan2(cy - agent.y, cx - agent.x);
                let angleDiff = Math.abs(coverAngle - threatAngle);
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                angleDiff = Math.abs(angleDiff);
                
                if (angleDiff < Math.PI * 0.4) {
                    const score = 200 - distToAgent + angleDiff * 50;
                    if (score > bestScore) {
                        bestScore = score;
                        bestCover = { x: cx, y: cy };
                    }
                }
            }
            return bestCover;
        }

        function aiFire(agent) {
            if (agent.ammo <= 0 || agent.isReloading) return;
            agent.ammo--;
            const spread = (Math.random() - 0.5) * 0.08;
            const angle = agent.currentAngle + spread;
            const speed = 28;
            const muzzleDist = 16;
            const muzzleX = agent.x - Math.cos(agent.currentAngle) * muzzleDist;
            const muzzleY = agent.y - Math.sin(agent.currentAngle) * muzzleDist;
            
            const b = Pools.bullets.get();
            b.x = muzzleX; b.y = muzzleY;
            b.vx = -Math.cos(angle) * speed;
            b.vy = -Math.sin(angle) * speed;
            b.life = 45;
            b.prevX = muzzleX; b.prevY = muzzleY;
            b.isAWM = false;
            b.fromAI = true;
            b.team = agent.team;
            bullets.push(b);
            
            muzzleFlashes.push(new MuzzleFlash(muzzleX, muzzleY, agent.currentAngle, 0.7));
            createSmoke(muzzleX, muzzleY, agent.currentAngle, 2, 0.7);
            
            const sh = Pools.shells.get();
            sh.x = muzzleX; sh.y = muzzleY;
            const shellAngle = agent.currentAngle + 1.4 + (Math.random() - 0.5) * 0.8;
            sh.vx = Math.cos(shellAngle) * (2.5 + Math.random() * 2);
            sh.vy = Math.sin(shellAngle) * (2.5 + Math.random() * 2) - 2;
            sh.rotation = Math.random() * Math.PI;
            sh.vRot = -0.3 - Math.random() * 0.3;
            sh.gravity = 0.25;
            sh.life = 120; sh.alpha = 1; sh.type = 'rifle';
            shells.push(sh);
            
            agent.x -= Math.cos(agent.currentAngle) * 1.2;
            agent.y -= Math.sin(agent.currentAngle) * 1.2;
        }

        function updateAI(dt) {
            for (const agent of aiAgents) {
                if (agent.state === 'dead') {
                    agent.deadTimer += dt;
                    if (agent.deadTimer >= agent.respawnTime) {
                        const spawn = findSafeSpawn(agent.spawnX, agent.spawnY, agent.radius);
                        agent.x = spawn.x; agent.y = spawn.y;
                        agent.state = 'alive';
                        agent.hp = agent.maxHp;
                        agent.ammo = agent.maxAmmo;
                        agent.isReloading = false;
                        agent.stateAI = 'patrol';
                        agent.fireCooldown = 0;
                        agent.path = [];
                        agent.target = null;
                        agent.targetUpdateTimer = 0;
                        agent.strafeDir = Math.random() > 0.5 ? 1 : -1;
                        agent.tacticalState = 'approach';
                    }
                    continue;
                }
                
                agent.fireCooldown -= dt;
                agent.strafeTimer -= dt;
                agent.coverTimer -= dt;
                agent.suppression *= 0.98;
                
                if (agent.isReloading) {
                    agent.reloadTime += dt;
                    if (agent.reloadTime >= agent.reloadDuration) {
                        agent.isReloading = false;
                        agent.ammo = agent.maxAmmo;
                    }
                }
                
                agent.targetUpdateTimer -= dt;
                if (agent.targetUpdateTimer <= 0 || !agent.target || (agent.target.hp !== undefined && agent.target.hp <= 0) || (agent.target.isPlayer && playerState === 'dead')) {
                    agent.target = findBestTarget(agent);
                    agent.targetUpdateTimer = 200 + Math.random() * 300;
                }
                
                if (agent.isReloading) {
                    agent.stateAI = 'reload';
                } else if (agent.ammo <= 0) {
                    agent.isReloading = true;
                    agent.reloadTime = 0;
                    agent.stateAI = 'reload';
                } else if (agent.target) {
                    const dist = Math.hypot(agent.target.x - agent.x, agent.target.y - agent.y);
                    const hasLOS = hasLineOfSight(agent, agent.target);
                    
                    if (dist < agent.attackRange && hasLOS) {
                        agent.stateAI = 'attack';
                    } else {
                        agent.stateAI = 'chase';
                    }
                } else {
                    agent.stateAI = 'patrol';
                }
                
                if (agent.stateAI === 'attack') {
                    const aimAngle = Math.atan2(agent.target.y - agent.y, agent.target.x - agent.x);
                    const desiredAngle = aimAngle + Math.PI;
                    agent.currentAngle = lerpAngle(agent.currentAngle, desiredAngle, agent.angleSpeed);
                    const dist = Math.hypot(agent.target.x - agent.x, agent.target.y - agent.y);
                    
                    const minRange = 160;
                    const idealRangeMin = 240;
                    const idealRangeMax = 320;
                    
                    let moveAngle = aimAngle;
                    let moveSpeed = 0;
                    
                    if (dist < minRange) {
                        moveAngle = aimAngle + Math.PI;
                        moveSpeed = agent.speed * 0.85;
                        agent.tacticalState = 'retreat';
                    } else if (dist > idealRangeMax + 40) {
                        moveAngle = aimAngle;
                        moveSpeed = agent.speed * 0.65;
                        agent.tacticalState = 'approach';
                    } else if (dist >= idealRangeMin && dist <= idealRangeMax) {
                        if (agent.strafeTimer <= 0) {
                            agent.strafeDir = Math.random() > 0.5 ? 1 : -1;
                            agent.strafeTimer = 800 + Math.random() * 1200;
                        }
                        moveAngle = aimAngle + agent.strafeDir * (Math.PI / 2 + 0.3);
                        moveSpeed = agent.speed * 0.45;
                        agent.tacticalState = 'strafe';
                        
                        if (agent.suppression > 0.3 && agent.coverTimer <= 0) {
                            const cover = findNearbyCover(agent, agent.target.x, agent.target.y);
                            if (cover) {
                                agent.path = findPath(agent.x, agent.y, cover.x, cover.y);
                                agent.coverTimer = 2000;
                            }
                        }
                    } else {
                        moveAngle = dist < idealRangeMin ? aimAngle + Math.PI : aimAngle;
                        moveSpeed = agent.speed * 0.35;
                    }
                    
                    const mx = Math.cos(moveAngle) * moveSpeed;
                    const my = Math.sin(moveAngle) * moveSpeed;
                    
                    if (!checkCollision(agent.x + mx, agent.y, agent.radius)) agent.x += mx;
                    if (!checkCollision(agent.x, agent.y + my, agent.radius)) agent.y += my;
                    
                    if (agent.fireCooldown <= 0 && hasLineOfSight(agent, agent.target)) {
                        aiFire(agent);
                        agent.fireCooldown = agent.fireRate;
                    }
                } else if (agent.stateAI === 'chase') {
                    agent.pathTimer -= dt;
                    if (agent.pathTimer <= 0 || !agent.path || agent.path.length === 0) {
                        const chaseTarget = {
                            x: agent.target.x + (Math.random() - 0.5) * 100,
                            y: agent.target.y + (Math.random() - 0.5) * 100
                        };
                        agent.path = findPath(agent.x, agent.y, chaseTarget.x, chaseTarget.y);
                        agent.pathTimer = agent.pathUpdateInterval;
                    }
                    followPath(agent);
                    const aimAngle = Math.atan2(agent.target.y - agent.y, agent.target.x - agent.x);
                    agent.currentAngle = lerpAngle(agent.currentAngle, aimAngle + Math.PI, agent.angleSpeed * 0.5);
                } else if (agent.stateAI === 'patrol') {
                    if (!agent.patrolTarget || Math.hypot(agent.patrolTarget.x - agent.x, agent.patrolTarget.y - agent.y) < 40) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 120 + Math.random() * 280;
                        let tx = agent.spawnX + Math.cos(angle) * dist;
                        let ty = agent.spawnY + Math.sin(angle) * dist;
                        tx = Math.max(agent.radius, Math.min(MAP_WIDTH * TILE_SIZE - agent.radius, tx));
                        ty = Math.max(agent.radius, Math.min(MAP_HEIGHT * TILE_SIZE - agent.radius, ty));
                        agent.patrolTarget = {x: tx, y: ty};
                    }
                    agent.pathTimer -= dt;
                    if (agent.pathTimer <= 0 || !agent.path || agent.path.length === 0) {
                        agent.path = findPath(agent.x, agent.y, agent.patrolTarget.x, agent.patrolTarget.y);
                        agent.pathTimer = agent.pathUpdateInterval;
                    }
                    followPath(agent);
                } else if (agent.stateAI === 'reload') {
                    if (agent.target) {
                        const aimAngle = Math.atan2(agent.target.y - agent.y, agent.target.x - agent.x);
                        agent.currentAngle = lerpAngle(agent.currentAngle, aimAngle + Math.PI, agent.angleSpeed * 0.3);
                        
                        const dist = Math.hypot(agent.target.x - agent.x, agent.target.y - agent.y);
                        if (dist < 180) {
                            const mx = -Math.cos(aimAngle) * agent.speed * 0.6;
                            const my = -Math.sin(aimAngle) * agent.speed * 0.6;
                            if (!checkCollision(agent.x + mx, agent.y, agent.radius)) agent.x += mx;
                            if (!checkCollision(agent.x, agent.y + my, agent.radius)) agent.y += my;
                        } else if (agent.coverTimer <= 0) {
                            const cover = findNearbyCover(agent, agent.target.x, agent.target.y);
                            if (cover) {
                                agent.path = findPath(agent.x, agent.y, cover.x, cover.y);
                                agent.coverTimer = 3000;
                            }
                        }
                    }
                    if (agent.path && agent.path.length > 0) followPath(agent);
                }
                
                for (const other of aiAgents) {
                    if (other === agent || other.state === 'dead') continue;
                    const dist = Math.hypot(other.x - agent.x, other.y - agent.y);
                    const minDist = agent.radius + other.radius;
                    if (dist < minDist && dist > 0) {
                        const push = (minDist - dist) / dist * 0.5;
                        agent.x -= (other.x - agent.x) * push;
                        agent.y -= (other.y - agent.y) * push;
                    }
                }
                
                agent.x = Math.max(agent.radius, Math.min(agent.x, MAP_WIDTH * TILE_SIZE - agent.radius));
                agent.y = Math.max(agent.radius, Math.min(agent.y, MAP_HEIGHT * TILE_SIZE - agent.radius));
            }
        }

        function drawAI(ctx) {
            for (const agent of aiAgents) {
                if (agent.state === 'dead') {
                    const x = agent.x - camera.x, y = agent.y - camera.y;
                    ctx.fillStyle = agent.team === 'ally' ? 'rgba(0,0,100,0.35)' : 'rgba(100,0,0,0.35)';
                    ctx.beginPath(); ctx.ellipse(x, y + 6, agent.radius, agent.radius * 0.5, 0.3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#aaa';
                    ctx.font = '11px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(`${agent.name} ${Math.ceil((agent.respawnTime - agent.deadTimer)/1000)}s`, x, y - 18);
                    continue;
                }
                
                const x = agent.x - camera.x, y = agent.y - camera.y;
                if (x + 60 < 0 || x - 60 > canvas.width || y + 60 < 0 || y - 60 > canvas.height) continue;
                
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.ellipse(x + 2, y + 2, agent.radius, agent.radius * 0.8, 0, 0, Math.PI*2); ctx.fill();
                
                const grd = ctx.createRadialGradient(x - 3, y - 3, 0, x, y, agent.radius);
                if (agent.team === 'ally') {
                    grd.addColorStop(0, '#88BBFF'); grd.addColorStop(0.5, '#4488DD'); grd.addColorStop(1, '#2255AA');
                } else {
                    grd.addColorStop(0, '#FF8888'); grd.addColorStop(0.5, '#DD4444'); grd.addColorStop(1, '#AA2222');
                }
                ctx.fillStyle = grd;
                ctx.beginPath(); ctx.arc(x, y, agent.radius, 0, Math.PI*2); ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - Math.cos(agent.currentAngle) * 20, y - Math.sin(agent.currentAngle) * 20);
                ctx.stroke();
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(agent.currentAngle);
                ctx.scale(0.08, 0.08);
                drawM4Local(ctx);
                ctx.restore();
                
                const hpPct = agent.hp / agent.maxHp;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(x - 18, y - 26, 36, 4);
                ctx.fillStyle = hpPct > 0.5 ? '#00ff88' : hpPct > 0.25 ? '#ffaa00' : '#ff4444';
                ctx.fillRect(x - 18, y - 26, 36 * hpPct, 4);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(agent.name, x, y - 30);
                
                if (agent.isReloading) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.font = '10px Arial';
                    ctx.fillText('换弹', x, y + 24);
                }
                
                if (agent.tacticalState === 'strafe') {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '9px Arial';
                    ctx.fillText('◄ ►', x, y + 34);
                }
            }
        }

                    y += 14;
                }

        }

        class MuzzleFlash {
            constructor(x, y, gunRotation, sizeMultiplier = 1) {
                this.x = x; this.y = y;
                this.life = 1;
                this.size = (Math.random() * 4 + 5) * 1.25 * sizeMultiplier;
                this.rotation = gunRotation + (Math.random() - 0.5) * 0.6;
                this.points = [];
                for (let i = 0; i < 8; i++) this.points.push(Math.random() * 0.5 + 0.5);
                this.flashIntensity = Math.random() * 0.3 + 0.7;
                this.coreColor = Math.random() > 0.5 ? '#ffffff' : '#ffffcc';
            }
            update() { this.life -= 0.2; this.size *= 1.1; }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x - camera.x, this.y - camera.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.life * this.flashIntensity;
                ctx.fillStyle = 'rgba(255, 180, 30, 0.4)';
                ctx.beginPath(); ctx.arc(0, 0, this.size * 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255, 220, 80, 0.6)';
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = this.size * this.points[i] * 1.5;
                    if (i === 0) ctx.moveTo(Math.cos(angle)*r, Math.sin(angle)*r);
                    else ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
                }
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#ffff55';
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + 0.2;
                    const r = this.size * 0.8;
                    if (i === 0) ctx.moveTo(Math.cos(angle)*r, Math.sin(angle)*r);
                    else ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
                }
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = this.coreColor;
                ctx.beginPath(); ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,200,0.8)';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(-this.size*2, 0); ctx.lineTo(this.size*2, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -this.size*2); ctx.lineTo(0, this.size*2); ctx.stroke();
                ctx.restore();
            }
        }

        function drawMagazine(ctx, x, y, rotation, alpha, hasBullets = true, isNew = false) {

            ctx.quadraticCurveTo(-15, 55, -12, 25); ctx.closePath(); ctx.fill();

            for (let i = -6; i <= 6; i += 3) { ctx.beginPath(); ctx.moveTo(i, 5); ctx.lineTo(i + (i>0?1.5:-1.5), 75); ctx.stroke(); }

        function localToWorld(lx, ly) {
            const s = gun.scale, recoilRad = gun.recoilRot * Math.PI / 180;
            let x = lx * s, y = ly * s;
            const cosR = Math.cos(recoilRad), sinR = Math.sin(recoilRad);
            const x1 = x * cosR - y * sinR + gun.recoilX + HOLD_OFFSET.x;
            const y1 = x * sinR + y * cosR + gun.recoilY + HOLD_OFFSET.y;
            const cosB = Math.cos(gun.rotation), sinB = Math.sin(gun.rotation);
            return { x: player.x + x1 * cosB - y1 * sinB, y: player.y + x1 * sinB + y1 * cosB };
        }

        function localToWorldRPG(lx, ly) {
            const s = rpg.scale, recoilRad = rpg.recoilRot * Math.PI / 180;
            let x = lx * s, y = ly * s;
            const cosR = Math.cos(recoilRad), sinR = Math.sin(recoilRad);
            const x1 = x * cosR - y * sinR + rpg.recoilX + HOLD_OFFSET.x;
            const y1 = x * sinR + y * cosR + rpg.recoilY + HOLD_OFFSET.y;
            const cosB = Math.cos(rpg.rotation), sinB = Math.sin(rpg.rotation);
            return { x: player.x + x1 * cosB - y1 * sinB, y: player.y + x1 * sinB + y1 * cosB };
        }

            const y1 = x * sinR + y * cosR + awm.recoilY + HOLD_OFFSET.y;

        function drawM4Local(ctx) {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(95, -5, 55, 10);

            ctx.beginPath(); ctx.moveTo(150, -12); ctx.lineTo(210, -12); ctx.lineTo(210, 12); ctx.lineTo(150, 12); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#1e1e1e';
            ctx.beginPath(); ctx.moveTo(150, -12); ctx.lineTo(210, -12); ctx.lineTo(205, -16); ctx.lineTo(150, -16); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#151515';
            ctx.beginPath(); ctx.moveTo(150, 12); ctx.lineTo(210, 12); ctx.lineTo(205, 16); ctx.lineTo(150, 16); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#0a0a0a';

        function createShell() {
            const ejection = localToWorld(65, -15);
            const angle = gun.rotation;
            const shellVx = -3 - Math.random() * 2;
            const shellVy = -4 - Math.random() * 3;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            const sh = Pools.shells.get();
            sh.x = ejection.x; sh.y = ejection.y;
            sh.vx = shellVx * cos - shellVy * sin;
            sh.vy = shellVx * sin + shellVy * cos;
            sh.rotation = Math.random() * Math.PI;
            sh.vRot = -0.3 - Math.random() * 0.3;
            sh.gravity = 0.25;
            sh.life = 120; sh.alpha = 1; sh.type = 'rifle';
            shells.push(sh);
        }

                    const dist = Math.hypot(b.x - player.x, b.y - player.y);
                    if (dist < player.radius + 5) {
                        playerHP -= b.isAWM ? 75 : 24;
                        damageFlash = 1;
                        createImpactParticles(b.x, b.y, false);
                        createBloodSplatter(b.x, b.y);
                        for (let k = 0; k < 8; k++) {
                            const p = Pools.particles.get();

                            const angle = Math.random() * Math.PI * 2;
                            const speed = 1 + Math.random() * 3;
                            p.vx = Math.cos(angle) * speed;
                            p.vy = Math.sin(angle) * speed;
                                p.gravity = 0.2;

                            p.size = 2 + Math.random() * 3;
                            p.type = 'debris'; p.color = '#aa0000';
                            particles.push(p);
                        }
                        if (playerHP <= 0) {
                            playerState = 'dead';
                            playerDeadTimer = 0;
                            createDeathBlood(player.x, player.y);
                            for (let k = 0; k < 25; k++) {
                                const p = Pools.particles.get();
                                p.x = player.x; p.y = player.y;
                                const angle = Math.random() * Math.PI * 2;

        const bloodDecals = [];

            for (let i = 0; i < 3; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 25;
                bloodDecals.push({
                    x: x + Math.cos(angle) * dist,
                    y: y + Math.sin(angle) * dist,
                    size: 3 + Math.random() * 8,
                    alpha: 0.6 + Math.random() * 0.3,
                    life: 1
                });
            }
        }
        function createDeathBlood(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 35;
                bloodDecals.push({
                    x: x + Math.cos(angle) * dist,
                    y: y + Math.sin(angle) * dist,
                    size: 8 + Math.random() * 15,
                    alpha: 0.7 + Math.random() * 0.3,

        function drawBloodDecals(ctx) {
            for (const b of bloodDecals) {
                const x = b.x - camera.x;
                const y = b.y - camera.y;
                if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) continue;
                const g = ctx.createRadialGradient(x, y, 0, x, y, b.size);
                g.addColorStop(0, `rgba(139, 0, 0, ${b.alpha * 0.8})`);
                g.addColorStop(0.5, `rgba(100, 0, 0, ${b.alpha * 0.5})`);
                g.addColorStop(1, `rgba(60, 0, 0, 0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, b.size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawBullets(ctx) {
            for (const b of bullets) {
                const x = b.x - camera.x;
                const y = b.y - camera.y;
                const px = b.prevX - camera.x;
                const py = b.prevY - camera.y;
                
                const dx = x - px;
                const dy = y - py;
                const len = Math.hypot(dx, dy) * 2.5;
                if (len < 1) continue;
                
                const tailX = x - (dx / Math.hypot(dx, dy)) * len;
                const tailY = y - (dy / Math.hypot(dx, dy)) * len;
                
                ctx.save();
                if (b.isAWM) {
                    const grad = ctx.createLinearGradient(tailX, tailY, x, y);
                    grad.addColorStop(0, 'rgba(200, 230, 255, 0)');
                    grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
                    grad.addColorStop(1, 'rgba(255, 255, 255, 1)');
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = '#aaddff';
                    ctx.shadowBlur = 10;
                } else {
                    const grad = ctx.createLinearGradient(tailX, tailY, x, y);
                    grad.addColorStop(0, 'rgba(255, 200, 50, 0)');
                    grad.addColorStop(0.4, 'rgba(255, 220, 100, 0.5)');
                    grad.addColorStop(1, 'rgba(255, 255, 220, 0.95)');
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#ffaa00';
                    ctx.shadowBlur = 8;
                }
                
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(x, y);
                ctx.stroke();
                
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(x, y, b.isAWM ? 0.8 : 1.2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.96;
                if (p.type === 'debris') p.rotation += p.vRot;
                p.life--;
                if (p.life <= 0) {
                    Pools.particles.release(particles[i]);
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles(ctx) {
            for (const p of particles) {
                ctx.save();
                ctx.translate(p.x - camera.x, p.y - camera.y);
                const alpha = Math.max(0, p.life / p.maxLife);
                ctx.globalAlpha = alpha;
                if (p.type === 'debris') {
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                } else if (p.type === 'spark') {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'flash') {
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
                    g.addColorStop(0, `rgba(255, 255, 220, ${alpha})`);
                    g.addColorStop(0.4, `rgba(255, 200, 80, ${alpha * 0.7})`);
                    g.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI*2);
                    ctx.fill();
                } else if (p.type === 'fire') {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * alpha, 0, Math.PI*2);
                    ctx.fill();
                } else if (p.type === 'explosion') {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * alpha, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }
