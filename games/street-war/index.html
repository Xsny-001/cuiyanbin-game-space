                p.y = muzzle.y;
                p.vx = Math.cos(angle + Math.PI + spread) * speed;
                p.vy = Math.sin(angle + Math.PI + spread) * speed;
                p.life = 20 + Math.random() * 15;
                p.maxLife = p.life;
                p.size = 2 + Math.random() * 5;
                p.gravity = 0; p.rotation = 0; p.vRot = 0;
                p.type = 'fire';
                p.color = `hsl(${15 + Math.random() * 40}, 100%, ${50 + Math.random() * 50}%)`;
                particles.push(p);
            }
            
            muzzleFlashes.push(new MuzzleFlash(muzzle.x, muzzle.y, rpg.rotation, 2.5));
            
            rpg.recoilX = 5;
            rpg.recoilY = -2.5;
            rpg.recoilRot = 1.2;
            
            createRPGShell();
            
            screenShake.x = (Math.random() - 0.5) * 15;
            screenShake.y = (Math.random() - 0.5) * 15;
        }

        function updateRockets() {
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                r.x += r.vx;
                r.y += r.vy;
                r.life--;
                r.angle = Math.atan2(r.vy, r.vx);
                
                if (r.safeTimer > 0) r.safeTimer--;
                
                r.trail.push({ x: r.x, y: r.y, life: 15 });
                if (r.trail.length > 15) r.trail.shift();
                
                const backAngle = r.angle + Math.PI;
                for (let j = 0; j < 4; j++) {
                    const spread = (Math.random() - 0.5) * 0.6;
                    const speed = 2 + Math.random() * 4;
                    const p = Pools.particles.get();
                    p.x = r.x - Math.cos(r.angle) * 8;
                    p.y = r.y - Math.sin(r.angle) * 8;
                    p.vx = Math.cos(backAngle + spread) * speed;
                    p.vy = Math.sin(backAngle + spread) * speed;
                    p.life = 8 + Math.random() * 8;
                    p.maxLife = p.life;
                    p.size = 1.5 + Math.random() * 3;
                    p.gravity = 0; p.rotation = 0; p.vRot = 0;
                    p.type = 'fire';
                    p.color = `hsl(${10 + Math.random() * 35}, 100%, ${55 + Math.random() * 45}%)`;
                    particles.push(p);
                }
                
                for (let j = 0; j < 3; j++) {
                    const spread = (Math.random() - 0.5) * 0.4;
                    const speed = 1 + Math.random() * 2;
                    const sm = Pools.smokes.get();
                    sm.x = r.x - Math.cos(r.angle) * 6;
                    sm.y = r.y - Math.sin(r.angle) * 6;
                    sm.vx = Math.cos(backAngle + spread) * speed;
                    sm.vy = Math.sin(backAngle + spread) * speed;
                    sm.size = 2 + Math.random() * 4;
                    sm.grow = 0.12;
                    sm.alpha = 0.35;
                    sm.life = 35 + Math.random() * 25;
                    smokes.push(sm);
                }
                
                let hit = false;
                let hitObs = null;
                
                if (!hit && r.safeTimer <= 0) {
                    for (const agent of aiAgents) {
                        if (agent.state === 'dead') continue;
                        const dist = Math.hypot(r.x - agent.x, r.y - agent.y);
                        if (dist < agent.radius + 15) {
                            createRocketExplosion(r.x, r.y, null);
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (!hit && r.safeTimer <= 0 && playerState === 'alive' && playerInvincibleTimer <= 0 && !Settings.godMode) {
                    const dist = Math.hypot(r.x - player.x, r.y - player.y);
                    if (dist < player.radius + 15) {
                        createRocketExplosion(r.x, r.y, null);
                        hit = true;
                    }
                }
                
                if (!hit) {
                    const nearby = SpatialGrid.getNearby(r.x, r.y, 20);
                    for (const obs of nearby) {
                        if (obs.solid && r.x > obs.x && r.x < obs.x + obs.w && r.y > obs.y && r.y < obs.y + obs.h) {
                            hitObs = obs;
                            createRocketExplosion(r.x, r.y, obs);
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (hit || r.life <= 0 || r.x < -200 || r.x > MAP_WIDTH * TILE_SIZE + 200 || r.y < -200 || r.y > MAP_HEIGHT * TILE_SIZE + 200) {
                    if (!hit && r.life <= 0) createRocketExplosion(r.x, r.y, null);
                    Pools.rockets.release(rockets[i]);
                    rockets.splice(i, 1);
                }
            }
        }

        function drawRockets(ctx) {
            for (const r of rockets) {
                for (let i = 0; i < r.trail.length - 1; i++) {
                    const t = r.trail[i];
                    const alpha = (i / r.trail.length) * 0.4;
                    ctx.beginPath();
                    ctx.arc(t.x - camera.x, t.y - camera.y, 2 * (i / r.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(200, 200, 200, ${alpha})`;
                    ctx.fill();
                }
                
                ctx.save();
                ctx.translate(r.x - camera.x, r.y - camera.y);
                ctx.rotate(r.angle);
                const s = 0.13;
                
                ctx.fillStyle = '#4a4a4a';
                for (let i = -1; i <= 1; i += 2) {
                    ctx.beginPath();
                    ctx.moveTo(-130 * s, i * 6 * s);
                    ctx.lineTo(-170 * s, i * 22 * s);
                    ctx.lineTo(-150 * s, i * 22 * s);
                    ctx.lineTo(-120 * s, i * 14 * s);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#4a5d23';
                ctx.fillRect(-120 * s, -14 * s, 100 * s, 28 * s);
                ctx.fillStyle = '#3a4d13';
                ctx.fillRect(-120 * s, 10 * s, 100 * s, 4 * s);
                ctx.fillStyle = '#5a6d33';
                ctx.fillRect(-120 * s, -14 * s, 100 * s, 4 * s);
                
                ctx.strokeStyle = '#3a4a1a';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-110 * s + i * 22 * s, -14 * s);
                    ctx.lineTo(-110 * s + i * 22 * s, 14 * s);
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#6a6a6a';
                ctx.beginPath();
                ctx.moveTo(20 * s, -12 * s);
                ctx.lineTo(70 * s, 0);
                ctx.lineTo(20 * s, 12 * s);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#8a8a8a';
                ctx.beginPath();
                ctx.moveTo(20 * s, -12 * s);
                ctx.lineTo(70 * s, 0);
                ctx.lineTo(20 * s, -4 * s);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.moveTo(70 * s, 0);
                ctx.lineTo(85 * s, 0);
                ctx.lineTo(70 * s, 3 * s);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255, 150, 50, 0.9)';
                ctx.beginPath();
                ctx.moveTo(-120 * s, -6 * s);
                ctx.lineTo(-160 * s - Math.random() * 30 * s, 0);
                ctx.lineTo(-120 * s, 6 * s);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255, 255, 200, 0.7)';
                ctx.beginPath();
                ctx.moveTo(-120 * s, -3 * s);
                ctx.lineTo(-145 * s - Math.random() * 15 * s, 0);
                ctx.lineTo(-120 * s, 3 * s);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
        }

        function createRocketExplosion(x, y, obs = null) {
            explosions.push({ x, y, radius: 5, maxRadius: 90, alpha: 1, type: 'shockwave' });
            explosions.push({ x, y, radius: 8, maxRadius: 50, alpha: 0.9, type: 'fireball' });
            
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 7;
                const p = Pools.particles.get();
                p.x = x; p.y = y;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                p.life = 30 + Math.random() * 25;
                p.maxLife = p.life;
                p.size = 4 + Math.random() * 10;
                p.gravity = 0; p.rotation = 0; p.vRot = 0;
                p.type = 'explosion';
                p.color = `hsl(${5 + Math.random() * 55}, 100%, ${50 + Math.random() * 50}%)`;
                particles.push(p);
            }
            
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 10;
                const p = Pools.particles.get();
                p.x = x; p.y = y;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                p.life = 15 + Math.random() * 15;
                p.maxLife = p.life;
                p.size = 1 + Math.random() * 2;
                p.gravity = 0; p.rotation = 0; p.vRot = 0;
                p.type = 'spark';
                p.color = `hsl(${25 + Math.random() * 35}, 100%, 80%)`;
                particles.push(p);
            }
            
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                const p = Pools.particles.get();
                p.x = x; p.y = y;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed - 1;
                p.gravity = 0.25;
                p.life = 30 + Math.random() * 30;
                p.maxLife = p.life;
                p.size = 2 + Math.random() * 4;
                p.rotation = Math.random() * Math.PI;
                p.vRot = (Math.random() - 0.5) * 0.4;
                p.type = 'debris';
                p.color = ['#777', '#555', '#444', '#666'][Math.floor(Math.random()*4)];
                particles.push(p);
            }
            
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                const sm = Pools.smokes.get();
                sm.x = x; sm.y = y;
                sm.vx = Math.cos(angle) * speed;
                sm.vy = Math.sin(angle) * speed - 1.5;
                sm.size = 10 + Math.random() * 30;
                sm.grow = 0.3;
                sm.alpha = 0.6;
                sm.life = 60 + Math.random() * 50;
                smokes.push(sm);
            }
            
            const explosionRadius = 140;
            const maxDamage = 200;
            
            for (const agent of aiAgents) {
                if (agent.state === 'dead') continue;
                const dist = Math.hypot(agent.x - x, agent.y - y);
                if (dist < explosionRadius) {
                    const dmg = Settings.oneShot ? 9999 : Math.max(30, maxDamage * (1 - dist / explosionRadius));
                    agent.hp -= dmg;
                    if (agent.hp <= 0) {
                        agent.state = 'dead';
                        agent.deadTimer = 0;
                        agent.stateAI = 'dead';
                        createDeathBlood(agent.x, agent.y);
                        for (let k = 0; k < 25; k++) {
                            const p = Pools.particles.get();
                            p.x = agent.x; p.y = agent.y;
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 2 + Math.random() * 5;
                            p.vx = Math.cos(angle) * speed;
                            p.vy = Math.sin(angle) * speed;
                            p.gravity = 0.3;
                            p.life = 40 + Math.random() * 30;
                            p.maxLife = p.life;
                            p.size = 3 + Math.random() * 4;
                            p.rotation = Math.random() * Math.PI;
                            p.vRot = (Math.random() - 0.5) * 0.3;
                            p.type = 'debris';
                            p.color = ['#8B0000', '#AA0000', '#660000'][Math.floor(Math.random()*3)];
                            particles.push(p);
                        }
                    }
                }
            }
            
            if (playerState === 'alive' && playerInvincibleTimer <= 0 && !Settings.godMode) {
                const dist = Math.hypot(player.x - x, player.y - y);
                if (dist < explosionRadius) {
                    const damage = Math.max(30, maxDamage * (1 - dist / explosionRadius));
                    playerHP -= damage;
                    damageFlash = 1;
                    if (playerHP <= 0) {
                        playerState = 'dead';
                        playerDeadTimer = 0;
                        createDeathBlood(player.x, player.y);
                        for (let k = 0; k < 25; k++) {
                            const p = Pools.particles.get();
                            p.x = player.x; p.y = player.y;
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 2 + Math.random() * 5;
                            p.vx = Math.cos(angle) * speed;
                            p.vy = Math.sin(angle) * speed;
                            p.gravity = 0.3;
                            p.life = 40 + Math.random() * 30;
                            p.maxLife = p.life;
                            p.size = 3 + Math.random() * 4;
                            p.rotation = Math.random() * Math.PI;
                            p.vRot = (Math.random() - 0.5) * 0.3;
                            p.type = 'debris';
                            p.color = ['#8B0000', '#AA0000', '#660000'][Math.floor(Math.random()*3)];
                            particles.push(p);
                        }
                    }
                }
            }
            
            if (obs) {
                for (let k = 0; k < 3; k++) {
                    obs.scorches.push({
                        x: x - obs.x - 30 + Math.random() * 60,
                        y: y - obs.y - 30 + Math.random() * 60,
                        size: 35 + Math.random() * 45
                    });
                }
            } else {
                for (let k = 0; k < 3; k++) {
                    map.decals.push({
                        x: x - 30 + Math.random() * 60,
                        y: y - 30 + Math.random() * 60,
                        type: 'scorch',
                        size: 35 + Math.random() * 45
                    });
                }
            }
            
            screenShake.x = (Math.random() - 0.5) * 30;
            screenShake.y = (Math.random() - 0.5) * 30;
        }

        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.radius += (e.maxRadius - e.radius) * 0.12;
                e.alpha -= 0.03;
                if (e.alpha <= 0) explosions.splice(i, 1);
            }
        }

        function drawExplosions(ctx) {
            for (const e of explosions) {
                const x = e.x - camera.x;
                const y = e.y - camera.y;
                if (e.type === 'fireball') {
                    const g = ctx.createRadialGradient(x, y, 0, x, y, e.radius);
                    g.addColorStop(0, `rgba(255, 200, 50, ${e.alpha})`);
                    g.addColorStop(0.5, `rgba(255, 100, 30, ${e.alpha * 0.7})`);
                    g.addColorStop(1, 'rgba(255, 50, 0, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(x, y, e.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 200, 100, ${e.alpha})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = `rgba(255, 80, 30, ${e.alpha * 0.2})`;
                    ctx.fill();
                }
            }
        }

        function fireRifle() {
            if (gun.isReloading || (gun.ammo <= 0 && !Settings.infAmmo)) {
                if (gun.ammo <= 0 && !gun.isReloading) startReload();
                return;
            }
            if (!Settings.infAmmo) gun.ammo--;
            updateAmmoDisplay();
            gun.recoilX = 1 + Math.random() * 0.5;
            gun.recoilY = -0.6 - Math.random() * 0.4;
            gun.recoilRot = 0.3 + Math.random() * 0.2;
            gun.boltOffset = 1.5;
            setTimeout(() => createShell(), 30);
            const muzzle = localToWorld(-108, -16);
            createSmoke(muzzle.x, muzzle.y, gun.rotation);
            muzzleFlashes.push(new MuzzleFlash(muzzle.x, muzzle.y, gun.rotation));
            createBullet();
        }

        function fireRPG() {
            if (rpg.isReloading || (rpg.ammo <= 0 && !Settings.infAmmo)) {
                if (rpg.ammo <= 0 && !rpg.isReloading) startReload();
                return;
            }
            if (!Settings.infAmmo) rpg.ammo--;
            updateAmmoDisplay();
            createRocket();
        }

        function fireAWM() {
            if (awm.isReloading || awm.isBolting || (awm.ammo <= 0 && !Settings.infAmmo)) {
                if (awm.ammo <= 0 && !awm.isReloading && !awm.isBolting) startReload();
                return;
            }
            if (!Settings.infAmmo) awm.ammo--;
            updateAmmoDisplay();
            awm.recoilX = 5 + Math.random() * 1;
            awm.recoilY = -2.5 - Math.random() * 1;
            awm.recoilRot = 2.0 + Math.random() * 0.5;
            awm.isBolting = true;
            awm.boltTimer = 0;
            
            setTimeout(() => createAWMShell(), 100);
            
            const muzzle = localToWorldAWM(-93, 0);
            createSmoke(muzzle.x, muzzle.y, awm.rotation, 5, 1.5);
            muzzleFlashes.push(new MuzzleFlash(muzzle.x, muzzle.y, awm.rotation, 2.0));
            createAWMBullet();
            
            screenShake.x = (Math.random() - 0.5) * 25;
            screenShake.y = (Math.random() - 0.5) * 25;
        }

        function fire() {
            if (playerState === 'dead') return;
            if (currentWeapon === 'rifle') fireRifle();
            else if (currentWeapon === 'rpg') fireRPG();
            else fireAWM();
        }

        function startReload() {
            if (playerState === 'dead') return;
            if (Settings.infAmmo) {
                if (currentWeapon === 'rifle') gun.ammo = gun.maxAmmo;
                else if (currentWeapon === 'rpg') rpg.ammo = rpg.maxAmmo;
                else awm.ammo = awm.maxAmmo;
                updateAmmoDisplay();
                return;
            }
            if (currentWeapon === 'rifle') {
                if (gun.isReloading || gun.ammo === gun.maxAmmo) return;
                gun.isReloading = true; gun.reloadPhase = 0; gun.reloadTimer = 0; gun.droppedMag = false;
                document.getElementById('reloadStatus').classList.add('show');
            } else if (currentWeapon === 'rpg') {
                if (rpg.isReloading || rpg.ammo === rpg.maxAmmo) return;
                rpg.isReloading = true;
                document.getElementById('reloadStatus').classList.add('show');
                setTimeout(() => {
                    if (currentWeapon === 'rpg') {
                        rpg.ammo = rpg.maxAmmo;
                        rpg.isReloading = false;
                        updateAmmoDisplay();
                        document.getElementById('reloadStatus').classList.remove('show');
                    }
                }, 2500);
            } else {
                if (awm.isReloading || awm.ammo === awm.maxAmmo) return;
                awm.isReloading = true;
                document.getElementById('reloadStatus').classList.add('show');
                setTimeout(() => {
                    if (currentWeapon === 'awm') {
                        awm.ammo = awm.maxAmmo;
                        awm.isReloading = false;
                        awm.isBolting = false;
                        updateAmmoDisplay();
                        document.getElementById('reloadStatus').classList.remove('show');
                    }
                }, 3000);
            }
        }

        function updateReload(dt) {
            if (currentWeapon !== 'rifle' || !gun.isReloading) return;
            gun.reloadTimer += dt;
            const t = gun.reloadTimer;
            if (t < 400) {
                gun.reloadPhase = 0; const p = t / 400;
                gun.magOffsetY = p * 60; gun.magRotation = p * 0.3; gun.magAlpha = 1 - p * 0.5;
                gun.newMagAlpha = 0; gun.newMagY = 100;
                if (!gun.droppedMag && t > 200) {
                    gun.droppedMag = true;
                    const dropPos = localToWorld(55, 80);
                    droppedMags.push({
                        x: dropPos.x + (Math.random() - 0.5) * 30, y: dropPos.y + (Math.random() - 0.5) * 30,
                        vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                        rotation: Math.random() * Math.PI, vRot: (Math.random() - 0.5) * 0.3,
                        alpha: 1, life: 150
                    });
                }
            } else if (t < 800) {
                gun.reloadPhase = 1; const p = (t - 400) / 400;
                gun.magOffsetY = 60 + p * 100; gun.magRotation = 0.3 + p * 0.5; gun.magAlpha = 0.5 - p * 0.5;
                gun.newMagAlpha = p; gun.newMagY = 100 - p * 100; gun.newMagRotation = -0.2 * (1 - p);
            } else if (t < 1100) {
                gun.reloadPhase = 2; const p = (t - 800) / 300;
                gun.magAlpha = 0; gun.newMagAlpha = 1; gun.newMagY = 0; gun.newMagRotation = 0;
                if (p < 0.3) gun.recoilY = Math.sin(p * 30) * 0.2;
            } else {
                gun.isReloading = false; gun.magInserted = true;
                gun.magOffsetY = 0; gun.magRotation = 0; gun.magAlpha = 1;
                gun.newMagAlpha = 0; gun.newMagY = 0; gun.ammo = gun.maxAmmo;
                updateAmmoDisplay();
                document.getElementById('reloadStatus').classList.remove('show');
            }
        }

        function updateAmmoDisplay() {
            const el = document.getElementById('ammoUi');
            if (currentWeapon === 'rifle') {
                el.textContent = `${gun.ammo} / ${gun.maxAmmo}`;
                el.className = '';
                if (gun.ammo === 0) el.classList.add('empty');
                else if (gun.ammo <= 5) el.classList.add('low');
            } else if (currentWeapon === 'rpg') {
                el.textContent = `${rpg.ammo} / ${rpg.maxAmmo}`;
                el.className = '';
                if (rpg.ammo === 0) el.classList.add('empty');
                else if (rpg.ammo <= 2) el.classList.add('low');
            } else {
                el.textContent = `${awm.ammo} / ${awm.maxAmmo}`;
                el.className = '';
                if (awm.ammo === 0) el.classList.add('empty');
                else if (awm.ammo <= 2) el.classList.add('low');
            }
        }

        function switchWeapon() {
            if (playerState === 'dead') return;
            if (currentWeapon === 'rifle') {
                currentWeapon = 'rpg';
                rpg.rotation = gun.rotation;
                gun.isReloading = false;
                document.getElementById('reloadStatus').classList.remove('show');
            } else if (currentWeapon === 'rpg') {
                currentWeapon = 'awm';
                awm.rotation = rpg.rotation;
                rpg.isReloading = false;
                rpg.charging = false;
                document.getElementById('reloadStatus').classList.remove('show');
            } else {
                currentWeapon = 'rifle';
                gun.rotation = awm.rotation;
                awm.isReloading = false;
                awm.isBolting = false;
                awm.charging = false;
                document.getElementById('reloadStatus').classList.remove('show');
            }
            updateAmmoDisplay();
        }

        const camera = {
            x: 0, y: 0, targetX: 0, targetY: 0,
            update() {
                this.targetX = player.x - canvas.width / 2; this.targetY = player.y - canvas.height / 2;
                this.x += (this.targetX - this.x) * 0.1; this.y += (this.targetY - this.y) * 0.1;
                const maxX = MAP_WIDTH * TILE_SIZE - canvas.width, maxY = MAP_HEIGHT * TILE_SIZE - canvas.height;
                this.x = Math.max(0, Math.min(this.x, maxX)); this.y = Math.max(0, Math.min(this.y, maxY));
            }
        };

        const moveJoystick = {
            active: false, baseX: 120, baseY: 0, stickX: 120, stickY: 0,
            radius: 60, stickRadius: 25, dx: 0, dy: 0,
            updateBase() { this.baseY = canvas.height - 120; if (!this.active) { this.stickX = this.baseX; this.stickY = this.baseY; } }
        };
        const fireJoystick = {
            active: false, baseX: 0, baseY: 0, stickX: 0, stickY: 0,
            radius: 60, stickRadius: 25, dx: 0, dy: 0,
            updateBase() { this.baseX = canvas.width - 120; this.baseY = canvas.height - 120; if (!this.active) { this.stickX = this.baseX; this.stickY = this.baseY; } }
        };
        const reloadBtn = { x: 0, y: 0, r: 30, updatePos() { this.x = canvas.width - 60; this.y = canvas.height - 220; } };
        const weaponBtn = { x: 0, y: 0, r: 30, updatePos() { this.x = canvas.width - 60; this.y = canvas.height - 300; } };
        // 解除锁定按钮
        const unlockBtn = { x: 0, y: 0, r: 30, updatePos() { this.x = canvas.width - 60; this.y = canvas.height - 380; } };

        function updateMoveJoystick(x, y) {
            const dx = x - moveJoystick.baseX, dy = y - moveJoystick.baseY;
            const dist = Math.hypot(dx, dy), maxDist = moveJoystick.radius;
            if (dist > maxDist) {
                const angle = Math.atan2(dy, dx);
                moveJoystick.stickX = moveJoystick.baseX + Math.cos(angle) * maxDist;
                moveJoystick.stickY = moveJoystick.baseY + Math.sin(angle) * maxDist;
                moveJoystick.dx = Math.cos(angle); moveJoystick.dy = Math.sin(angle);
            } else {
                moveJoystick.stickX = x; moveJoystick.stickY = y;
                moveJoystick.dx = dx / maxDist; moveJoystick.dy = dy / maxDist;
            }
            moveJoystick.active = true;
        }
        function resetMoveJoystick() {
            moveJoystick.active = false; moveJoystick.dx = 0; moveJoystick.dy = 0;
            moveJoystick.stickX = moveJoystick.baseX; moveJoystick.stickY = moveJoystick.baseY;
        }
        function updateFireJoystick(x, y) {
            const dx = x - fireJoystick.baseX, dy = y - fireJoystick.baseY;
            const dist = Math.hypot(dx, dy), maxDist = fireJoystick.radius;
            if (dist > maxDist) {
                const angle = Math.atan2(dy, dx);
                fireJoystick.stickX = fireJoystick.baseX + Math.cos(angle) * maxDist;
                fireJoystick.stickY = fireJoystick.baseY + Math.sin(angle) * maxDist;
                fireJoystick.dx = Math.cos(angle); fireJoystick.dy = Math.sin(angle);
            } else {
                fireJoystick.stickX = x; fireJoystick.stickY = y;
                fireJoystick.dx = dx / maxDist; fireJoystick.dy = dy / maxDist;
            }
            fireJoystick.active = true;
            if (dist > 5) {
                const targetAngle = Math.atan2(fireJoystick.dy, fireJoystick.dx) - Math.PI;
                if (currentWeapon === 'rifle') gun.rotation = targetAngle;
                else if (currentWeapon === 'rpg') rpg.rotation = targetAngle;
                else awm.rotation = targetAngle;
                // 使用摇杆时清除辅助瞄准
                AimAssist.clearTarget();
            }
        }
        function resetFireJoystick() {
            fireJoystick.active = false; fireJoystick.dx = 0; fireJoystick.dy = 0;
            fireJoystick.stickX = fireJoystick.baseX; fireJoystick.stickY = fireJoystick.baseY;
            gun.autoFire = false;
        }

        let moveTouchId = null, fireTouchId = null, mouseTarget = null;
        function getTouchPos(t) { const rect = canvas.getBoundingClientRect(); return { x: t.clientX - rect.left, y: t.clientY - rect.top }; }

        canvas.addEventListener('touchstart', (e) => {
            if (playerState === 'dead') return;
            e.preventDefault();
            for (let t of e.changedTouches) {
                const pos = getTouchPos(t); reloadBtn.updatePos(); weaponBtn.updatePos(); unlockBtn.updatePos();
                if (Math.hypot(pos.x - weaponBtn.x, pos.y - weaponBtn.y) < weaponBtn.r + 20) { switchWeapon(); continue; }
                if (Math.hypot(pos.x - reloadBtn.x, pos.y - reloadBtn.y) < reloadBtn.r + 20) { startReload(); continue; }
                // 解除锁定按钮
                if (Math.hypot(pos.x - unlockBtn.x, pos.y - unlockBtn.y) < unlockBtn.r + 20) {
                    AimAssist.clearTarget();
                    continue;
                }
                if (moveTouchId === null && Math.hypot(pos.x - moveJoystick.baseX, pos.y - moveJoystick.baseY) < 120) {
                    moveTouchId = t.identifier; updateMoveJoystick(pos.x, pos.y); continue;
                }
                if (fireTouchId === null && Math.hypot(pos.x - fireJoystick.baseX, pos.y - fireJoystick.baseY) < 120) {
                    fireTouchId = t.identifier;
                    // 锁定状态下，开火键直接开火，不控制方向
                    if (AimAssist.active) {
                        if (currentWeapon === 'rifle') { gun.autoFire = true; gun.lastFireTime = 0; fire(); }
                        else if (currentWeapon === 'rpg') { rpg.charging = true; }
                        else { awm.charging = true; }
                    } else {
                        updateFireJoystick(pos.x, pos.y);
                        if (currentWeapon === 'rifle') { gun.autoFire = true; gun.lastFireTime = 0; fire(); }
                        else if (currentWeapon === 'rpg') { rpg.charging = true; }
                        else { awm.charging = true; }
                    }
                    continue;
                }
                // 点击地图其他地方设置辅助瞄准目标
                const worldX = pos.x + camera.x;
                const worldY = pos.y + camera.y;
                AimAssist.setTarget(worldX, worldY);
            }
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            if (playerState === 'dead') return;
            e.preventDefault();
            for (let t of e.changedTouches) {
                const pos = getTouchPos(t);
                if (t.identifier === moveTouchId) updateMoveJoystick(pos.x, pos.y);
                if (t.identifier === fireTouchId) { 
                    // 锁定状态下，开火键不控制方向，只开火
                    if (AimAssist.active) {
                        if (currentWeapon === 'rifle' && !gun.autoFire) { gun.autoFire = true; gun.lastFireTime = 0; }
                    } else {
                        updateFireJoystick(pos.x, pos.y); 
                        if (currentWeapon === 'rifle' && !gun.autoFire) { gun.autoFire = true; gun.lastFireTime = 0; } 
                    }
                }
            }
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === moveTouchId) { moveTouchId = null; resetMoveJoystick(); }
                if (t.identifier === fireTouchId) { 
                    if (currentWeapon === 'rpg' && rpg.charging) {
                        fireRPG();
                        rpg.charging = false;
                    }
                    if (currentWeapon === 'awm' && awm.charging) {
                        fireAWM();
                        awm.charging = false;
                    }
                    fireTouchId = null; resetFireJoystick(); 
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (playerState === 'dead') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top; reloadBtn.updatePos(); weaponBtn.updatePos(); unlockBtn.updatePos();
            if (Math.hypot(x - weaponBtn.x, y - weaponBtn.y) < weaponBtn.r + 20) { switchWeapon(); return; }
            if (Math.hypot(x - reloadBtn.x, y - reloadBtn.y) < reloadBtn.r + 20) { startReload(); return; }
            // 解除锁定按钮
            if (Math.hypot(x - unlockBtn.x, y - unlockBtn.y) < unlockBtn.r + 20) {
                AimAssist.clearTarget();
                return;
            }
            if (Math.hypot(x - moveJoystick.baseX, y - moveJoystick.baseY) < 120) { mouseTarget = 'move'; updateMoveJoystick(x, y); return; }
            if (Math.hypot(x - fireJoystick.baseX, y - fireJoystick.baseY) < 120) {
                mouseTarget = 'fire';
                // 锁定状态下，开火键直接开火，不控制方向
                if (AimAssist.active) {
                    if (currentWeapon === 'rifle') { gun.autoFire = true; gun.lastFireTime = 0; fire(); }
                    else if (currentWeapon === 'rpg') { rpg.charging = true; }
                    else { awm.charging = true; }
                } else {
                    updateFireJoystick(x, y); 
                    if (currentWeapon === 'rifle') { gun.autoFire = true; gun.lastFireTime = 0; fire(); }
                    else if (currentWeapon === 'rpg') { rpg.charging = true; }
                    else { awm.charging = true; }
                }
                return;
            }
            
            // 点击地图设置辅助瞄准目标（排除UI区域）
            const worldX = x + camera.x;
            const worldY = y + camera.y;
            AimAssist.setTarget(worldX, worldY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!mouseTarget || playerState === 'dead') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            if (mouseTarget === 'move') updateMoveJoystick(x, y);
            if (mouseTarget === 'fire') { 
                // 锁定状态下，鼠标移动不控制方向
                if (!AimAssist.active) {
                    updateFireJoystick(x, y); 
                    if (currentWeapon === 'rifle' && !gun.autoFire) { gun.autoFire = true; gun.lastFireTime = 0; } 
                }
            }
        });
        canvas.addEventListener('mouseup', () => {
            if (mouseTarget === 'move') resetMoveJoystick();
            if (mouseTarget === 'fire') {
                if (currentWeapon === 'rpg' && rpg.charging) {
                    fireRPG();
                    rpg.charging = false;
                }
                if (currentWeapon === 'awm' && awm.charging) {
                    fireAWM();
                    awm.charging = false;
                }
                resetFireJoystick();
            }
            mouseTarget = null;
        });

        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (playerState === 'dead') return;
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') { 
                e.preventDefault(); 
                if (currentWeapon === 'rifle') { if (!gun.isReloading && (gun.ammo > 0 || Settings.infAmmo)) fire(); }
                else if (currentWeapon === 'rpg') { if (!rpg.isReloading && (rpg.ammo > 0 || Settings.infAmmo) && !rpg.charging) rpg.charging = true; }
                else { if (!awm.isReloading && !awm.isBolting && (awm.ammo > 0 || Settings.infAmmo) && !awm.charging) awm.charging = true; }
            }
            if (e.code === 'KeyR') startReload();
            if (e.code === 'KeyQ') switchWeapon();
        });
        window.addEventListener('keyup', (e) => { 
            keys[e.key.toLowerCase()] = false; 
            if (e.code === 'Space' && currentWeapon === 'rpg' && rpg.charging) {
                fireRPG();
                rpg.charging = false;
            }
            if (e.code === 'Space' && currentWeapon === 'awm' && awm.charging) {
                fireAWM();
                awm.charging = false;
            }
        });

        const respawnBtn = document.getElementById('respawnBtn');
        respawnBtn.addEventListener('click', () => {
            playerState = 'alive';
            playerMaxHP = Settings.playerMaxHP;
            playerHP = playerMaxHP;
            playerInvincibleTimer = 5000;
            player.x = MAP_WIDTH * TILE_SIZE / 2;
            player.y = MAP_HEIGHT * TILE_SIZE / 2;
            gun.ammo = gun.maxAmmo; gun.isReloading = false;
            rpg.ammo = rpg.maxAmmo; rpg.isReloading = false;
            awm.ammo = awm.maxAmmo; awm.isReloading = false; awm.isBolting = false;
            updateAmmoDisplay();
            AimAssist.clearTarget();
            respawnBtn.classList.remove('show');
        });

        function checkCollision(x, y, radius) {
            const px = x - radius, py = y - radius, pw = radius * 2, ph = radius * 2;
            const nearby = SpatialGrid.getNearby(x, y, radius);
            for (const obs of nearby) {
                if (obs.solid && px < obs.x + obs.w && px + pw > obs.x && py < obs.y + obs.h && py + ph > obs.y) return true;
            }
            return false;
        }
        function resolveCollision(newX, newY) {
            if (!checkCollision(newX, player.y, player.radius)) player.x = newX;
            if (!checkCollision(player.x, newY, player.radius)) player.y = newY;
        }

        function drawGround() {
            const sc = Math.floor(camera.x / TILE_SIZE), ec = sc + Math.ceil(canvas.width / TILE_SIZE) + 1;
            const sr = Math.floor(camera.y / TILE_SIZE), er = sr + Math.ceil(canvas.height / TILE_SIZE) + 1;
            for (let row = sr; row <= er; row++) {
                for (let col = sc; col <= ec; col++) {
                    if (row >= 0 && row < MAP_HEIGHT && col >= 0 && col < MAP_WIDTH) {
                        const type = map.ground[row][col], x = col * TILE_SIZE - camera.x, y = row * TILE_SIZE - camera.y;
                        drawTexture(ctx, type, x, y, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }
        function drawDecals() {
            ctx.globalAlpha = 0.6;
            for (const d of map.decals) {
                const x = d.x - camera.x, y = d.y - camera.y;
                if (x < -100 || x > canvas.width + 100 || y < -100 || y > canvas.height + 100) continue;
                if (d.type === 'oil') {
                    const g = ctx.createRadialGradient(x, y, 0, x, y, d.size);
                    g.addColorStop(0, 'rgba(20,20,20,0.8)'); g.addColorStop(1, 'rgba(20,20,20,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, d.size, 0, Math.PI*2); ctx.fill();
                } else if (d.type === 'scorch') {
                    const g = ctx.createRadialGradient(x, y, 0, x, y, d.size);
                    g.addColorStop(0, 'rgba(2,2,2,0.9)');
                    g.addColorStop(0.4, 'rgba(8,8,8,0.6)');
                    g.addColorStop(0.7, 'rgba(15,15,15,0.3)');
                    g.addColorStop(1, 'rgba(25,25,25,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, d.size, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(x - d.size/2, y); ctx.lineTo(x + d.size/2, y + d.size/3); ctx.stroke();
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawShadows() {
            const nearbyObs = SpatialGrid.getNearby(camera.x + canvas.width/2, camera.y + canvas.height/2, Math.max(canvas.width, canvas.height));
            for (const obs of nearbyObs) {
                if (!obs.solid) continue;
                const x = obs.x - camera.x, y = obs.y - camera.y;
                if (x + obs.w < -50 || x > canvas.width + 50 || y + obs.h < -50 || y > canvas.height + 50) continue;
                
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.moveTo(x, y + obs.h);
                ctx.lineTo(x + obs.w, y + obs.h);
                ctx.lineTo(x + obs.w + 15, y + obs.h + 25);
                ctx.lineTo(x - 15, y + obs.h + 25);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.moveTo(x + obs.w, y);
                ctx.lineTo(x + obs.w, y + obs.h);
                ctx.lineTo(x + obs.w + 25, y + obs.h + 15);
                ctx.lineTo(x + obs.w + 25, y - 10);
                ctx.closePath();
                ctx.fill();
            }
            
            for (const agent of aiAgents) {
                if (agent.state === 'dead') continue;
                const x = agent.x - camera.x, y = agent.y - camera.y;
                if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) continue;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(x + 3, y + agent.radius + 2, agent.radius * 0.9, agent.radius * 0.4, 0, 0, Math.PI*2);
                ctx.fill();
            }
            
            if (playerState === 'alive') {
                const x = player.x - camera.x, y = player.y - camera.y;
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(x + 4, y + player.radius + 3, player.radius * 0.9, player.radius * 0.4, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawObstacles() {
            for (const obs of map.obstacles) {
                const x = obs.x - camera.x, y = obs.y - camera.y;
                if (x + obs.w < -100 || x > canvas.width + 100 || y + obs.h < -100 || y > canvas.height + 100) continue;
                
                const topH = 6;
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + 5, y + 5, obs.w, obs.h);
                
                if (obs.type === 'car') {
                    ctx.drawImage(TextureGenerator.textures.car, x, y, obs.w, obs.h);
                } else if (obs.type === 'sandbag') {
                    ctx.drawImage(TextureGenerator.textures.sandbag, x, y, obs.w, obs.h);
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fillRect(x, y + obs.h - 4, obs.w, 4);
                } else if (obs.type === 'wood') {
                    ctx.drawImage(TextureGenerator.textures.wood, x, y, obs.w, obs.h);
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(x, y + obs.h - 3, obs.w, 3);
                } else {
                    drawTexture(ctx, obs.type, x, y, obs.w, obs.h);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, obs.w, obs.h);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x, y, obs.w, 4);
                    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x, y + obs.h - 4, obs.w, 4);
                }
                
                if (obs.scorches && obs.scorches.length > 0) {
                    for (const sc of obs.scorches) {
                        const sx = x + sc.x;
                        const sy = y + sc.y;
                        const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sc.size);
                        g.addColorStop(0, 'rgba(3,3,3,0.9)');
                        g.addColorStop(0.3, 'rgba(10,10,10,0.7)');
                        g.addColorStop(0.7, 'rgba(20,20,20,0.3)');
                        g.addColorStop(1, 'rgba(30,30,30,0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(sx, sy, sc.size, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
                if (obs.bulletHoles && obs.bulletHoles.length > 0) {
                    for (const bh of obs.bulletHoles) {
                        const bx = x + bh.x;
                        const by = y + bh.y;
                        ctx.fillStyle = '#0a0a0a';
                        ctx.beginPath();
                        ctx.arc(bx, by, bh.size, 0, Math.PI*2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(40, 40, 40, 0.5)';
                        ctx.lineWidth = 0.8;
                        for (let k = 0; k < 3; k++) {
                            const crackAngle = Math.random() * Math.PI * 2;
                            const crackLen = bh.size * (1.5 + Math.random() * 2);
                            ctx.beginPath();
                            ctx.moveTo(bx + Math.cos(crackAngle) * bh.size, by + Math.sin(crackAngle) * bh.size);
                            ctx.lineTo(bx + Math.cos(crackAngle) * crackLen, by + Math.sin(crackAngle) * crackLen);
                            ctx.stroke();
                        }
                        ctx.strokeStyle = 'rgba(80, 80, 80, 0.3)';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.arc(bx, by, bh.size * 0.6, 0, Math.PI*2);
                        ctx.stroke();
                    }
                }
            }
        }
        function drawPlayer() {
            if (playerState === 'dead') {
                const x = player.x - camera.x, y = player.y - camera.y;
                ctx.fillStyle = 'rgba(80,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(x, y + 6, player.radius, player.radius * 0.5, 0.3, 0, Math.PI*2); ctx.fill();
                return;
            }
            
            const x = player.x - camera.x, y = player.y - camera.y;
            
            ctx.save();
            if (playerInvincibleTimer > 0) {
                ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 80) * 0.3;
            }
            
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath(); ctx.ellipse(x + 3, y + 3, player.radius, player.radius * 0.8, 0, 0, Math.PI*2); ctx.fill();
            const grd = ctx.createRadialGradient(x - 5, y - 5, 0, x, y, player.radius);
            grd.addColorStop(0, '#FFB088'); grd.addColorStop(0.3, '#FF6B35'); grd.addColorStop(1, '#CC4400');
            ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(x, y, player.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(x - 6, y - 6, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, player.radius, 0, Math.PI*2); ctx.stroke();
            
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(x - 20, y - 32, 40, 5);
            ctx.fillStyle = playerHP > 50 ? '#00ff88' : playerHP > 25 ? '#ffaa00' : '#ff4444';
            ctx.fillRect(x - 20, y - 32, 40 * (playerHP / playerMaxHP), 5);
            
            ctx.restore();
            
            ctx.save();
            ctx.translate(x, y);
            if (currentWeapon === 'rifle') {
                ctx.rotate(gun.rotation);
                ctx.translate(HOLD_OFFSET.x + gun.recoilX, HOLD_OFFSET.y + gun.recoilY);
                ctx.rotate(gun.recoilRot * Math.PI / 180); ctx.scale(gun.scale, gun.scale);
                drawM4Local(ctx);
            } else if (currentWeapon === 'rpg') {
                ctx.rotate(rpg.rotation);
                ctx.translate(HOLD_OFFSET.x + rpg.recoilX, HOLD_OFFSET.y + rpg.recoilY);
                ctx.rotate(rpg.recoilRot * Math.PI / 180); ctx.scale(rpg.scale, rpg.scale);
                drawRPGLocal(ctx);
            } else {
                ctx.rotate(awm.rotation);
                ctx.translate(HOLD_OFFSET.x + awm.recoilX, HOLD_OFFSET.y + awm.recoilY);
                ctx.rotate(awm.recoilRot * Math.PI / 180); ctx.scale(awm.scale, awm.scale);
                drawAWMLocal(ctx);
            }
            ctx.restore();
        }
        function drawMinimap() {
            const ms = 150, mx = canvas.width - ms - 20, my = 20, sc = ms / (MAP_WIDTH * TILE_SIZE);
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(mx - 5, my - 5, ms + 10, ms + 10);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(mx - 5, my - 5, ms + 10, ms + 10);
            ctx.fillStyle = '#444'; ctx.fillRect(mx, my, ms, ms);
            ctx.fillStyle = '#666'; ctx.fillRect(mx + 15*TILE_SIZE*sc, my, 11*TILE_SIZE*sc, ms); ctx.fillRect(mx, my + 10*TILE_SIZE*sc, ms, 11*TILE_SIZE*sc);
            ctx.fillStyle = '#888';
            const buildings = [{x:2,y:2,w:8,h:6},{x:28,y:2,w:10,h:6},{x:2,y:22,w:10,h:6},{x:30,y:22,w:8,h:6},{x:12,y:12,w:3,h:3},{x:26,y:14,w:2,h:4}];
            for (const b of buildings) ctx.fillRect(mx + b.x*TILE_SIZE*sc, my + b.y*TILE_SIZE*sc, b.w*TILE_SIZE*sc, b.h*TILE_SIZE*sc);
            
            for (const agent of aiAgents) {
                if (agent.state === 'dead') continue;
                ctx.fillStyle = agent.team === 'ally' ? '#4488ff' : '#ff4444';
                ctx.beginPath(); ctx.arc(mx + agent.x*sc, my + agent.y*sc, 3, 0, Math.PI*2); ctx.fill();
            }
            
            if (playerState === 'alive') {
                ctx.fillStyle = '#FF6B35'; ctx.beginPath(); ctx.arc(mx + player.x*sc, my + player.y*sc, 4, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(mx + player.x*sc, my + player.y*sc, 3, 0, Math.PI*2); ctx.fill();
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
            ctx.strokeRect(mx + camera.x*sc, my + camera.y*sc, canvas.width*sc, canvas.height*sc);
        }
        function drawJoystick(j) {
            j.updateBase();
            ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(j.baseX, j.baseY, j.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            ctx.globalAlpha = 0.6; ctx.fillStyle = j.active ? '#FF6B35' : '#fff';
            ctx.beginPath(); ctx.arc(j.stickX, j.stickY, j.stickRadius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.globalAlpha = 1;
            if (j.active) { ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(j.baseX, j.baseY); ctx.lineTo(j.stickX, j.stickY); ctx.stroke(); }
        }
        function drawReloadButton() {
            reloadBtn.updatePos(); const {x, y, r} = reloadBtn;
            ctx.globalAlpha = 0.4; ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('换弹', x, y);
            ctx.globalAlpha = 1;
        }
        function drawWeaponButton() {
            weaponBtn.updatePos(); const {x, y, r} = weaponBtn;
            ctx.globalAlpha = 0.5;
            let btnColor = '#222';
            if (currentWeapon === 'rpg') btnColor = '#4a5d23';
            else if (currentWeapon === 'awm') btnColor = '#3a4a3a';
            ctx.fillStyle = btnColor;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const label = currentWeapon === 'rpg' ? 'RPG' : currentWeapon === 'awm' ? 'AWM' : 'M4';
            ctx.fillText(label, x, y);
            ctx.globalAlpha = 1;
        }
        // 绘制解除锁定按钮
        function drawUnlockButton() {
            unlockBtn.updatePos(); const {x, y, r} = unlockBtn;
            ctx.globalAlpha = AimAssist.active ? 0.7 : 0.25;
            ctx.fillStyle = AimAssist.active ? '#ff4444' : '#222';
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = AimAssist.active ? '#ff8888' : '#fff';
            ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('解锁', x, y);
            ctx.globalAlpha = 1;
        }

        let lastTime = 0;
        function update(dt) {
            if (playerInvincibleTimer > 0) playerInvincibleTimer -= dt;
            
            // 更新辅助瞄准
            AimAssist.update();
            
            if (playerState === 'alive') {
                let dx = 0, dy = 0;
                if (keys['w'] || keys['arrowup']) dy = -1; if (keys['s'] || keys['arrowdown']) dy = 1;
                if (keys['a'] || keys['arrowleft']) dx = -1; if (keys['d'] || keys['arrowright']) dx = 1;
                if (moveJoystick.active) { dx = moveJoystick.dx; dy = moveJoystick.dy; }
                if (dx !== 0 || dy !== 0) { const len = Math.hypot(dx, dy); dx /= len; dy /= len; }
                const newX = player.x + dx * player.speed, newY = player.y + dy * player.speed;
                resolveCollision(newX, newY);
                player.x = Math.max(player.radius, Math.min(player.x, MAP_WIDTH * TILE_SIZE - player.radius));
                player.y = Math.max(player.radius, Math.min(player.y, MAP_HEIGHT * TILE_SIZE - player.radius));
                
                if (currentWeapon === 'rifle') {
                    gun.recoilX *= 0.85; gun.recoilY *= 0.85; gun.recoilRot *= 0.88;
                    if (gun.boltOffset > 0) { gun.boltOffset -= 1.5; if (gun.boltOffset < 0) gun.boltOffset = 0; }
                    if (gun.autoFire && !gun.isReloading && (gun.ammo > 0 || Settings.infAmmo)) {
                        const now = performance.now();
                        const fireDelay = Settings.fastFire ? 30 : 100;
                        if (now - gun.lastFireTime > fireDelay) { fire(); gun.lastFireTime = now; }
                    }
                } else if (currentWeapon === 'rpg') {
                    rpg.recoilX *= 0.85; rpg.recoilY *= 0.85; rpg.recoilRot *= 0.88;
                } else {
                    awm.recoilX *= 0.85; awm.recoilY *= 0.85; awm.recoilRot *= 0.88;
                    if (awm.isBolting) {
                        awm.boltTimer += dt;
                        if (awm.boltTimer > 1000) awm.isBolting = false;
                    }
                }
                
                updateReload(dt);
            } else {
                playerDeadTimer += dt;
                respawnBtn.classList.add('show');
            }
            
            updateAI(dt);
            updateShells(); updateSmokes(); updateDroppedMags(); updateBullets(); updateParticles();
            updateRockets(); updateExplosions();
            for (let i = muzzleFlashes.length - 1; i >= 0; i--) { muzzleFlashes[i].update(); if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1); }
            
            screenShake.x *= 0.85; screenShake.y *= 0.85;
            damageFlash *= 0.9;
            
            PerfOptimizer.tick();
            camera.update();
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);
            
            drawGround(); drawDecals(); drawShadows(); drawObstacles(); 
            drawBloodDecals(ctx);
            drawDroppedMags(ctx); drawShells(ctx); drawSmokes(ctx);
            drawBullets(ctx); drawParticles(ctx); 
            drawRockets(ctx); drawExplosions(ctx);
            drawAI(ctx);
            drawPlayer();
            
            // 绘制辅助瞄准标记和连线
            AimAssist.draw(ctx);
            
            if (currentWeapon === 'rpg' && rpg.charging && playerState === 'alive') {
                const px = player.x - camera.x;
                const py = player.y - camera.y;
                const lineLen = 250;
                const endX = px - Math.cos(rpg.rotation) * lineLen;
                const endY = py - Math.sin(rpg.rotation) * lineLen;
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 60, 60, 0.7)';
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 6]);
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255, 80, 80, 0.9)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(endX, endY, 12, 0, Math.PI*2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(endX - 18, endY); ctx.lineTo(endX + 18, endY);
                ctx.moveTo(endX, endY - 18); ctx.lineTo(endX, endY + 18);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 60, 60, 0.8)';
                ctx.beginPath();
                ctx.arc(endX, endY, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            
            if (currentWeapon === 'awm' && awm.charging && playerState === 'alive') {
                const px = player.x - camera.x;
                const py = player.y - camera.y;
                const lineLen = 400;
                const endX = px - Math.cos(awm.rotation) * lineLen;
                const endY = py - Math.sin(awm.rotation) * lineLen;
                ctx.save();
                ctx.strokeStyle = 'rgba(0, 255, 100, 0.8)';
                ctx.lineWidth = 1;
                ctx.setLineDash([15, 10]);
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(0, 255, 100, 0.9)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(endX, endY, 18, 0, Math.PI*2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(endX - 25, endY); ctx.lineTo(endX + 25, endY);
                ctx.moveTo(endX, endY - 25); ctx.lineTo(endX, endY + 25);
                ctx.stroke();
                ctx.fillStyle = 'rgba(0, 255, 100, 0.3)';
                ctx.beginPath();
                ctx.arc(endX, endY, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            
            ctx.restore();
            
            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);
            for (const f of muzzleFlashes) f.draw(ctx);
            ctx.restore();
            
            drawMinimap(); drawJoystick(moveJoystick); drawJoystick(fireJoystick); 
            drawReloadButton(); drawWeaponButton(); drawUnlockButton();
            drawSquadStatus();
            
            if (damageFlash > 0.01) {
                ctx.fillStyle = `rgba(255, 0, 0, ${damageFlash * 0.25})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            if (playerState === 'dead') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 52px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('你阵亡了', canvas.width/2, canvas.height/2 - 80);
            }
            
            const g = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.3, canvas.width/2, canvas.height/2, canvas.height*0.8);
            g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        function loop(timestamp) {
            const dt = timestamp - lastTime; lastTime = timestamp;
            update(dt); draw(); requestAnimationFrame(loop);
        }

        function init() {
            TextureGenerator.init(); initPatterns(); generateMap();
            SpatialGrid.clear();
            for (const obs of map.obstacles) SpatialGrid.add(obs);
            initAI();
            document.getElementById('loading').style.display = 'none';
            
            document.getElementById('startBtn').addEventListener('click', () => {
                document.getElementById('cover').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('cover').style.display = 'none';
                }, 500);
            });

            document.getElementById('enterBtn').addEventListener('click', () => {
                document.getElementById('copyright').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('copyright').style.display = 'none';
                }, 500);
                requestAnimationFrame(loop);
            });
        }
        init();
    </script>
</body>
</html>
